<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管钱助手</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #6366f1;
  --primary-light: #eef2ff;
  --primary-grad: linear-gradient(135deg, #6366f1, #8b5cf6);
  --success: #10b981;
  --success-light: #d1fae5;
  --danger: #ef4444;
  --danger-light: #fee2e2;
  --warning: #f59e0b;
  --warning-light: #fef3c7;
  --info: #3b82f6;
  --gray-50: #f8fafc;
  --gray-100: #f1f5f9;
  --gray-200: #e2e8f0;
  --gray-300: #cbd5e1;
  --gray-400: #94a3b8;
  --gray-500: #64748b;
  --gray-600: #475569;
  --gray-700: #334155;
  --gray-800: #1e293b;
  --gray-900: #0f172a;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 6px rgba(0,0,0,.06), 0 2px 4px rgba(0,0,0,.04);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.08);
  --transition: 0.2s ease;
}
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--gray-50); color: var(--gray-800); line-height: 1.6; -webkit-font-smoothing: antialiased; }
.container { max-width: 800px; margin: 0 auto; padding: 12px; }

/* Header */
.app-header { background: #fff; border-radius: var(--radius); padding: 16px 20px; margin-bottom: 12px; box-shadow: var(--shadow-sm); display: flex; justify-content: space-between; align-items: center; }
.app-header h1 { font-size: 20px; font-weight: 700; background: var(--primary-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.app-header .header-btns { display: flex; gap: 6px; }
.icon-btn { width: 36px; height: 36px; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; background: var(--gray-100); display: flex; align-items: center; justify-content: center; transition: var(--transition); }
.icon-btn:hover { background: var(--gray-200); }
.icon-btn.danger:hover { background: var(--danger-light); color: var(--danger); }

/* Nav */
.nav-bar { display: flex; gap: 2px; background: #fff; border-radius: var(--radius); padding: 3px; margin-bottom: 12px; box-shadow: var(--shadow-sm); overflow-x: auto; }
.nav-item { flex: 1; padding: 9px 6px; border: none; background: transparent; border-radius: 11px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--gray-400); transition: var(--transition); white-space: nowrap; text-align: center; min-width: 52px; }
.nav-item.active { background: var(--primary); color: #fff; box-shadow: var(--shadow); }
.nav-item:hover:not(.active) { color: var(--gray-600); background: var(--gray-50); }

/* Section */
.section { display: none; animation: fadeIn .25s ease; }
.section.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* Cards */
.card { background: #fff; border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-sm); margin-bottom: 12px; }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.card-header h2 { font-size: 16px; font-weight: 700; }
.card-header h3 { font-size: 14px; font-weight: 600; color: var(--gray-600); }

/* Overview cards */
.ov-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
.ov-card { border-radius: var(--radius); padding: 16px; color: #fff; position: relative; overflow: hidden; }
.ov-card::after { content: ''; position: absolute; right: -12px; top: -12px; width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,.1); }
.ov-card .ov-label { font-size: 12px; opacity: .85; margin-bottom: 4px; }
.ov-card .ov-value { font-size: 22px; font-weight: 700; }
.ov-card.green { background: linear-gradient(135deg, #059669, #10b981); }
.ov-card.red { background: linear-gradient(135deg, #dc2626, #ef4444); }
.ov-card.blue { background: linear-gradient(135deg, #4f46e5, #6366f1); }
@media (max-width: 420px) { .ov-grid { grid-template-columns: 1fr 1fr; } .ov-card:nth-child(3) { grid-column: span 2; } }

/* Stats row */
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px; margin-bottom: 12px; }
.stat-item { background: #fff; border-radius: var(--radius-sm); padding: 10px; text-align: center; box-shadow: var(--shadow-sm); }
.stat-item .num { font-size: 17px; font-weight: 700; }
.stat-item .lbl { font-size: 11px; color: var(--gray-400); margin-top: 2px; }

/* Buttons */
.btn { padding: 8px 16px; border: none; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; transition: var(--transition); display: inline-flex; align-items: center; gap: 4px; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: #4f46e5; }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { background: #059669; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #dc2626; }
.btn-warning { background: var(--warning); color: #fff; }
.btn-warning:hover { background: #d97706; }
.btn-outline { background: #fff; border: 1.5px solid var(--gray-200); color: var(--gray-700); }
.btn-outline:hover { background: var(--gray-50); }
.btn-sm { padding: 5px 10px; font-size: 11px; border-radius: 8px; }
.btn-block { width: 100%; justify-content: center; margin-top: 8px; }

/* Debt card */
.debt-card { background: #fff; border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm); margin-bottom: 10px; border-left: 4px solid var(--gray-200); transition: var(--transition); cursor: pointer; position: relative; }
.debt-card:hover { box-shadow: var(--shadow-md); }
.debt-card.normal { border-left-color: var(--success); }
.debt-card.warning { border-left-color: var(--warning); }
.debt-card.overdue { border-left-color: var(--danger); background: #fff5f5; }
.debt-card .dc-top { display: flex; justify-content: space-between; align-items: flex-start; }
.debt-card .dc-creditor { font-size: 15px; font-weight: 700; }
.debt-card .dc-amount { font-size: 18px; font-weight: 700; color: var(--gray-900); }
.debt-card .dc-remain { font-size: 13px; color: var(--gray-500); }
.debt-card .dc-due { font-size: 12px; color: var(--gray-400); margin-top: 4px; }
.debt-card .dc-badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
.debt-card .dc-badge.normal { background: var(--success-light); color: var(--success); }
.debt-card .dc-badge.warning { background: var(--warning-light); color: var(--warning); }
.debt-card .dc-badge.overdue { background: var(--danger-light); color: var(--danger); }
.debt-card .dc-progress { margin-top: 8px; }
.debt-card .dc-progress .track { height: 6px; background: var(--gray-100); border-radius: 3px; overflow: hidden; }
.debt-card .dc-progress .fill { height: 100%; border-radius: 3px; transition: width .4s; background: var(--success); }
.debt-card .dc-actions { display: flex; gap: 4px; margin-top: 10px; flex-wrap: wrap; }
.debt-card .reminder-toggle { position: absolute; top: 16px; right: 16px; font-size: 18px; cursor: pointer; opacity: .3; transition: var(--transition); }
.debt-card .reminder-toggle.on { opacity: 1; color: var(--primary); }

/* Asset card */
.asset-card { background: #fff; border-radius: var(--radius); padding: 14px 18px; box-shadow: var(--shadow-sm); margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
.asset-card .ac-icon { font-size: 28px; margin-right: 14px; flex-shrink: 0; }
.asset-card .ac-info { flex: 1; }
.asset-card .ac-name { font-size: 14px; font-weight: 700; }
.asset-card .ac-type { font-size: 11px; color: var(--gray-400); }
.asset-card .ac-balance { font-size: 18px; font-weight: 700; text-align: right; }
.asset-card .ac-actions { display: flex; gap: 4px; margin-left: 12px; }
.asset-card .ac-change { font-size: 11px; color: var(--gray-400); margin-top: 2px; text-align: right; }

/* Block grid for installment visualization */
.block-grid { display: flex; flex-wrap: wrap; gap: 3px; margin: 8px 0; }
.block-grid .block { width: 18px; height: 18px; border-radius: 3px; }
.block-grid .block.green { background: var(--success); }
.block-grid .block.red { background: var(--danger); }
.block-grid .block.gray { background: var(--gray-200); }
.block-grid .block.yellow { background: var(--warning); }

/* Calendar heatmap */
.cal-heatmap { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-top: 8px; }
.cal-heatmap .day-cell { aspect-ratio: 1; border-radius: 4px; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; border: 1px solid transparent; }
.cal-heatmap .day-cell .tooltip { display: none; position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%); background: var(--gray-800); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 10px; white-space: nowrap; z-index: 5; }
.cal-heatmap .day-cell:hover .tooltip { display: block; }
.cal-heatmap .day-header { font-size: 10px; color: var(--gray-400); text-align: center; padding: 4px 0; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(2px); }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: 16px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 22px; box-shadow: var(--shadow-lg); }
.modal-wide { max-width: 640px; }
.modal h3 { font-size: 17px; margin-bottom: 16px; font-weight: 700; }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-600); margin-bottom: 4px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 9px 12px; border: 1.5px solid var(--gray-200); border-radius: 10px; font-size: 13px; outline: none; transition: var(--transition); font-family: inherit; background: var(--gray-50); }
.form-group input:focus, .form-group select:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(99,102,241,.1); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.toggle-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.toggle-wrap label { font-size: 13px; font-weight: 600; cursor: pointer; }
.toggle { position: relative; width: 44px; height: 24px; flex-shrink: 0; cursor: pointer; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle .slider { position: absolute; inset: 0; background: var(--gray-300); border-radius: 12px; transition: .3s; }
.toggle .slider::before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .3s; }
.toggle input:checked + .slider { background: var(--primary); }
.toggle input:checked + .slider::before { transform: translateX(20px); }
.installment-section { background: var(--gray-50); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 12px; display: none; }
.installment-section.show { display: block; }
.installment-calc { background: var(--primary-light); border-radius: 8px; padding: 10px 14px; margin-top: 8px; font-size: 13px; }
.installment-calc .highlight { font-size: 17px; font-weight: 700; color: var(--primary); }

/* Calculator */
.calc-result { background: var(--primary-light); border-radius: var(--radius-sm); padding: 14px; margin: 12px 0; }
.calc-result .cr-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
.calc-result .cr-value { font-weight: 700; }

/* Toast */
.toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: var(--gray-800); color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 13px; z-index: 2000; opacity: 0; transition: .3s; pointer-events: none; box-shadow: var(--shadow-lg); }
.toast.show { opacity: 1; }

/* chart card */
.chart-card { background: #fff; border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm); margin-bottom: 12px; }
.chart-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: var(--gray-700); }
.chart-card canvas { max-height: 240px; }

/* section header */
.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.section-header h2 { font-size: 17px; font-weight: 700; }

/* filter bar */
.filter-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; padding: 10px 12px; background: #fff; border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); }
.filter-bar input, .filter-bar select { padding: 6px 10px; border: 1.5px solid var(--gray-200); border-radius: 8px; font-size: 12px; outline: none; }
.filter-bar input:focus { border-color: var(--primary); }

.empty-state { text-align: center; padding: 40px 20px; color: var(--gray-400); font-size: 14px; }
.empty-state .icon { font-size: 40px; margin-bottom: 8px; opacity: .4; }

/* table */
.table-wrap { overflow-x: auto; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-sm); }
table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 500px; }
th { background: var(--gray-50); text-align: left; padding: 8px 10px; font-weight: 600; color: var(--gray-500); border-bottom: 1.5px solid var(--gray-100); white-space: nowrap; font-size: 11px; }
td { padding: 8px 10px; border-bottom: 1px solid var(--gray-50); }
.text-green { color: var(--success); font-weight: 600; }
.text-red { color: var(--danger); font-weight: 600; }
.text-muted { color: var(--gray-400); font-size: 11px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 600; }
.badge-green { background: var(--success-light); color: var(--success); }
.badge-red { background: var(--danger-light); color: var(--danger); }
.badge-yellow { background: var(--warning-light); color: var(--warning); }
.badge-purple { background: var(--primary-light); color: var(--primary); }
.actions-cell { display: flex; gap: 3px; flex-wrap: wrap; }

.repayment-history { font-size: 11px; color: var(--gray-400); margin-top: 4px; }
.repayment-history summary { cursor: pointer; }
.repayment-history ul { margin: 2px 0 0 14px; }

@media (max-width: 480px) {
  .container { padding: 8px; }
  .modal { padding: 16px; border-radius: 16px 16px 0 0; position: fixed; bottom: 0; max-height: 85vh; }
  .form-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="container">
  <div class="app-header">
    <h1>管钱助手</h1>
    <div class="header-btns">
      <button class="icon-btn" onclick="exportAllCSV()" title="导出CSV">&#128190;</button>
      <button class="icon-btn" onclick="backupData()" title="备份">&#128190;</button>
      <button class="icon-btn danger" onclick="confirmClearAll()" title="清空">&#128465;</button>
    </div>
  </div>

  <div class="nav-bar">
    <button class="nav-item active" data-tab="overview">概览</button>
    <button class="nav-item" data-tab="assets">资产</button>
    <button class="nav-item" data-tab="debt">还债本</button>
    <button class="nav-item" data-tab="ledger">记账本</button>
    <button class="nav-item" data-tab="tools">工具</button>
  </div>

  <!-- ===== 概览 ===== -->
  <div class="section active" id="sectionOverview">
    <div class="ov-grid">
      <div class="ov-card green">
        <div class="ov-label">总资产</div><div class="ov-value" id="ovAssets">0.00</div>
      </div>
      <div class="ov-card red">
        <div class="ov-label">总负债</div><div class="ov-value" id="ovLiabilities">0.00</div>
      </div>
      <div class="ov-card blue">
        <div class="ov-label">净资产</div><div class="ov-value" id="ovNetWorth">0.00</div>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat-item"><div class="num green" id="ovTotalAssets">0</div><div class="lbl">账户资产</div></div>
      <div class="stat-item"><div class="num red" id="ovTotalDebt">0</div><div class="lbl">债务总额</div></div>
      <div class="stat-item"><div class="num" id="ovMonthDue">0</div><div class="lbl">本月待还</div></div>
      <div class="stat-item"><div class="num green" id="ovMonthPaid">0</div><div class="lbl">本月已还</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="chart-card"><h3>资产趋势</h3><canvas id="assetChart" style="max-height:200px;"></canvas></div>
      <div class="chart-card"><h3>负债趋势</h3><canvas id="liabilityChart" style="max-height:200px;"></canvas></div>
    </div>
    <div class="chart-card"><h3>本月待还款</h3><div id="upcomingRepays"></div></div>
  </div>

  <!-- ===== 资产 ===== -->
  <div class="section" id="sectionAssets">
    <div class="section-header">
      <h2>资产账户</h2>
      <button class="btn btn-primary btn-sm" onclick="openAssetModal()">+ 添加账户</button>
    </div>
    <div class="stats-row">
      <div class="stat-item"><div class="num green" id="aTotal">0</div><div class="lbl">总余额</div></div>
    </div>
    <div id="assetList"></div>
  </div>

  <!-- ===== 还债本 ===== -->
  <div class="section" id="sectionDebt">
    <div class="section-header">
      <h2>债务管理</h2>
      <button class="btn btn-primary btn-sm" onclick="openDebtModal()">+ 新增债务</button>
    </div>
    <div class="stats-row">
      <div class="stat-item"><div class="num" id="dbTotal">0</div><div class="lbl">总债务</div></div>
      <div class="stat-item"><div class="num green" id="dbPaid">0</div><div class="lbl">已还总额</div></div>
      <div class="stat-item"><div class="num red" id="dbRemain">0</div><div class="lbl">剩余总额</div></div>
      <div class="stat-item"><div class="num" id="dbOverdue">0</div><div class="lbl">逾期</div></div>
      <div class="stat-item"><div class="num purple" id="dbInstallment" style="color:#8b5cf6;">0</div><div class="lbl">分期中</div></div>
    </div>
    <div id="debtList"></div>
  </div>

  <!-- ===== 记账本 ===== -->
  <div class="section" id="sectionLedger">
    <div class="section-header">
      <h2>收支记录</h2>
      <button class="btn btn-primary btn-sm" onclick="openLedgerModal()">+ 新增记录</button>
    </div>
    <div class="filter-bar">
      <input type="date" id="filterDateFrom" onchange="renderLedger()" title="起始日期">
      <input type="date" id="filterDateTo" onchange="renderLedger()" title="结束日期">
      <select id="filterType" onchange="renderLedger()"><option value="">全部类型</option><option value="收入">收入</option><option value="支出">支出</option></select>
      <select id="filterCategory" onchange="renderLedger()"><option value="">全部分类</option></select>
      <button class="btn btn-sm btn-outline" onclick="clearLedgerFilter()">清除</button>
    </div>
    <div class="stats-row">
      <div class="stat-item"><div class="num green" id="lIncome">0</div><div class="lbl">总收入</div></div>
      <div class="stat-item"><div class="num red" id="lExpense">0</div><div class="lbl">总支出</div></div>
      <div class="stat-item"><div class="num" id="lBalance">0</div><div class="lbl">结余</div></div>
    </div>
    <div class="chart-card"><h3>月度支出热力图</h3><div id="expenseHeatmap"></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="chart-card"><h3>支出分类占比</h3><canvas id="pieChart"></canvas></div>
      <div class="chart-card"><h3>每日收支趋势</h3><canvas id="lineChart"></canvas></div>
    </div>
    <div class="table-wrap"><table><thead><tr><th>日期</th><th>类型</th><th>分类</th><th>金额</th><th>账户</th><th>备注</th><th>操作</th></tr></thead><tbody id="ledgerTableBody"></tbody></table></div>
  </div>

  <!-- ===== 工具 ===== -->
  <div class="section" id="sectionTools">
    <div class="card">
      <div class="card-header"><h2>房贷计算器</h2></div>
      <div class="form-row">
        <div class="form-group"><label>贷款总额</label><input id="mtTotal" type="number" value="1000000" step="1000" oninput="calcMortgage()"></div>
        <div class="form-group"><label>年利率(%)</label><input id="mtRate" type="number" value="4.2" step="0.01" oninput="calcMortgage()"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>贷款年限</label><select id="mtYears" onchange="calcMortgage()"><option value="10">10年</option><option value="15">15年</option><option value="20" selected>20年</option><option value="25">25年</option><option value="30">30年</option></select></div>
        <div class="form-group"><label>首次还款日</label><input id="mtStartDate" type="date" onchange="calcMortgage()"></div>
      </div>
      <div class="calc-result" id="mortgageResult"></div>
      <button class="btn btn-primary btn-block" id="btnImportDebt" style="display:none;" onclick="importMortgageAsDebt()">导入为分期债务</button>
      <div class="table-wrap" id="mortgageTable" style="margin-top:10px;display:none;"></div>
    </div>
    <div class="card" style="margin-top:12px;">
      <div class="card-header"><h2>复利计算器</h2></div>
      <div class="form-row">
        <div class="form-group"><label>本金</label><input id="ciPrincipal" type="number" value="100000" step="1000" oninput="calcCompound()"></div>
        <div class="form-group"><label>年利率(%)</label><input id="ciRate" type="number" value="5" step="0.1" oninput="calcCompound()"></div>
      </div>
      <div class="form-group"><label>投资年限</label><input id="ciYears" type="number" value="10" min="1" max="50" oninput="calcCompound()"></div>
      <div class="calc-result" id="compoundResult"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"><h3 id="modalTitle"></h3><div id="modalBody"></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ===================== DATA =====================
const S_DEBT='fin_debts_v2', S_LEDGER='fin_ledger_v2', S_ASSETS='fin_assets', S_CATS='fin_cats_v2', S_BACKUP='fin_backup_v2';
const DEF_CATS=['餐饮','交通','购物','娱乐','医疗','教育','住房','其他','债务还款'];
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function today(){return new Date().toISOString().slice(0,10);}
function Ld(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function Sv(k,d){localStorage.setItem(k,JSON.stringify(d));}
function fm(n){return Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function toast(m){
  const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._tmr);t._tmr=setTimeout(()=>t.classList.remove('show'),2200);
}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

let debts=Ld(S_DEBT,[]);
let ledger=Ld(S_LEDGER,[]);
let assets=Ld(S_ASSETS,[]);
let categories=Ld(S_CATS,DEF_CATS.slice());

// Migrate old debts if needed
debts.forEach(d=>{if(d.reminderEnabled===undefined)d.reminderEnabled=false;});

function sD(){Sv(S_DEBT,debts);}
function sL(){Sv(S_LEDGER,ledger);}
function sA(){Sv(S_ASSETS,assets);}
function sC(){Sv(S_CATS,categories);}

// ===================== TABS =====================
let curTab='overview';
document.querySelectorAll('.nav-item').forEach(item=>{
  item.addEventListener('click',()=>{
    document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
    item.classList.add('active');curTab=item.dataset.tab;
    document.getElementById('section'+curTab.charAt(0).toUpperCase()+curTab.slice(1)).classList.add('active');
    if(curTab==='overview')renderOverview();
    if(curTab==='assets')renderAssets();
    if(curTab==='debt')renderDebts();
    if(curTab==='ledger'){renderLedger();renderLedgerCharts();renderHeatmap();}
    if(curTab==='tools'){calcMortgage();calcCompound();}
  });
});

// ===================== OVERVIEW =====================
function renderOverview(){
  const totalAssets=assets.reduce((s,a)=>s+Number(a.balance),0);
  const totalDebtAmt=debts.reduce((s,d)=>s+Number(d.amount),0);
  const totalPaidAll=debts.reduce((s,d)=>s+getDebtPaid(d),0);
  const totalRemainAll=totalDebtAmt-totalPaidAll;
  const incomeAll=ledger.filter(r=>r.type==='收入').reduce((s,r)=>s+Number(r.amount),0);
  const expenseAll=ledger.filter(r=>r.type==='支出').reduce((s,r)=>s+Number(r.amount),0);
  const netW=totalAssets+incomeAll-expenseAll-totalRemainAll;

  document.getElementById('ovAssets').textContent=fm(totalAssets+incomeAll-expenseAll);
  document.getElementById('ovLiabilities').textContent=fm(totalRemainAll);
  document.getElementById('ovNetWorth').textContent=fm(netW);
  document.getElementById('ovTotalAssets').textContent=fm(totalAssets);
  document.getElementById('ovTotalDebt').textContent=fm(totalDebtAmt);

  // 本月待还/已还
  const now=new Date();const m=now.getMonth();const y=now.getFullYear();
  let monthDue=0,monthPaid=0;
  debts.forEach(d=>{
    if(d.isInstallment&&d.installments){
      d.installments.forEach(p=>{
        const pd=new Date(p.dueDate);
        if(pd.getMonth()===m&&pd.getFullYear()===y){
          monthDue+=p.amount;monthPaid+=p.paidAmount||0;
        }
      });
    }else{
      const dd=new Date(d.dueDate);
      if(dd.getMonth()===m&&dd.getFullYear()===y){
        monthDue+=Number(d.amount);monthPaid+=Number(d.paid||0);
      }
    }
  });
  document.getElementById('ovMonthDue').textContent=fm(monthDue);
  document.getElementById('ovMonthPaid').textContent=fm(monthPaid);

  // Upcoming repays
  const upcoming=document.getElementById('upcomingRepays');
  const allItems=[];
  debts.forEach(d=>{
    if(d.isInstallment&&d.installments){
      d.installments.forEach(p=>{
        const rem=p.amount-(p.paidAmount||0);if(rem<=0)return;
        allItems.push({creditor:d.creditor,date:p.dueDate,amount:rem,period:p.period,debtId:d.id});
      });
    }else{
      const rem=Number(d.amount)-Number(d.paid||0);if(rem<=0)return;
      allItems.push({creditor:d.creditor,date:d.dueDate,amount:rem,debtId:d.id});
    }
  });
  allItems.sort((a,b)=>a.date.localeCompare(b.date));
  const thisMonth=allItems.filter(x=>x.date.slice(0,7)===today().slice(0,7));
  if(!thisMonth.length){upcoming.innerHTML='<div class="empty-state" style="padding:20px;"><div class="icon">&#9989;</div>本月暂无待还款</div>';}
  else{
    upcoming.innerHTML=thisMonth.slice(0,8).map(x=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--gray-50);font-size:13px;"><span>${esc(x.creditor)}${x.period?' (第'+x.period+'期)':''}</span><span style="color:var(--gray-400);">${x.date}</span><strong class="text-red">${fm(x.amount)}</strong></div>`).join('');
  }

  // Charts
  renderOverviewCharts();
}

let assetChartInst=null, liabilityChartInst=null;
function renderOverviewCharts(){
  const ctxA=document.getElementById('assetChart')?.getContext('2d');
  const ctxL=document.getElementById('liabilityChart')?.getContext('2d');
  if(!ctxA||!ctxL)return;
  if(assetChartInst){assetChartInst.destroy();assetChartInst=null;}
  if(liabilityChartInst){liabilityChartInst.destroy();liabilityChartInst=null;}

  // Last 6 months
  const months=[];const now=new Date();
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(d.toISOString().slice(0,7));}

  // Asset trend: cumulative from ledger income-expense + asset balance
  const cumIncome=[];let running=assets.reduce((s,a)=>s+Number(a.balance),0);
  // Simplified: just show running asset balance as constant for now, plus ledger changes
  const monthlyIncomes=months.map(m=>ledger.filter(r=>r.date.slice(0,7)===m&&r.type==='收入').reduce((s,r)=>s+Number(r.amount),0));
  const monthlyExpenses=months.map(m=>ledger.filter(r=>r.date.slice(0,7)===m&&r.type==='支出').reduce((s,r)=>s+Number(r.amount),0));
  const assetData=[];let ar=running;
  months.forEach((m,i)=>{ar+=monthlyIncomes[i]-monthlyExpenses[i];assetData.push(ar);});

  // Liability trend
  const liabilityData=months.map(m=>{
    let total=0;debts.forEach(d=>{
      if(d.isInstallment&&d.installments){
        d.installments.forEach(p=>{const rem=p.amount-(p.paidAmount||0);if(rem>0&&p.dueDate.slice(0,7)<=m)total+=rem;});
      }else{
        const rem=Number(d.amount)-Number(d.paid||0);if(rem>0&&d.dueDate.slice(0,7)<=m)total+=rem;
      }
    });return total;
  });

  assetChartInst=new Chart(ctxA,{type:'line',data:{labels:months.map(m=>m.slice(5)),datasets:[{label:'总资产',data:assetData,borderColor:'#10b981',backgroundColor:'rgba(16,185,129,.1)',fill:true,tension:.4}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>v>=1e4?(v/1e4).toFixed(1)+'w':fm(v)}}}}});
  liabilityChartInst=new Chart(ctxL,{type:'line',data:{labels:months.map(m=>m.slice(5)),datasets:[{label:'总负债',data:liabilityData,borderColor:'#ef4444',backgroundColor:'rgba(239,68,68,.1)',fill:true,tension:.4}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>v>=1e4?(v/1e4).toFixed(1)+'w':fm(v)}}}}});
}

// ===================== ASSETS =====================
function renderAssets(){
  const list=document.getElementById('assetList');const total=assets.reduce((s,a)=>s+Number(a.balance),0);
  document.getElementById('aTotal').textContent=fm(total);
  if(!assets.length){list.innerHTML='<div class="empty-state"><div class="icon">&#128176;</div>暂无资产账户</div>';return;}
  const icons={支付宝:'&#128179;',微信:'&#128172;',银行卡:'&#127974;',现金:'&#128176;',其他:'&#128230;'};
  list.innerHTML=assets.map(a=>`<div class="asset-card">
    <div class="ac-icon">${icons[a.type]||'&#128176;'}</div>
    <div class="ac-info"><div class="ac-name">${esc(a.name)}</div><div class="ac-type">${esc(a.type)}</div></div>
    <div class="ac-balance">${fm(a.balance)}</div>
    <div class="ac-actions">
      <button class="btn btn-sm btn-outline" onclick="adjustAsset('${a.id}')">变动</button>
      <button class="btn btn-sm btn-outline" onclick="openAssetModal('${a.id}')">编辑</button>
      <button class="btn btn-sm btn-danger" onclick="deleteAsset('${a.id}')">删除</button>
    </div>
  </div>`).join('');
}

function openAssetModal(id){
  const a=id?assets.find(x=>x.id===id):null;
  const v=a||{name:'',type:'银行卡',balance:'',id:''};
  document.getElementById('modalContent').classList.remove('modal-wide');
  document.getElementById('modalTitle').textContent=a?'编辑账户':'添加账户';
  document.getElementById('modalBody').innerHTML=`
    <div class="form-group"><label>账户名称</label><input id="aName" value="${esc(v.name)}" placeholder="例：工资卡"></div>
    <div class="form-group"><label>账户类型</label><select id="aType">${['支付宝','微信','银行卡','现金','其他'].map(t=>`<option value="${t}" ${v.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="form-group"><label>当前余额</label><input id="aBalance" type="number" step="0.01" min="0" value="${v.balance}" placeholder="0.00"></div>
    <div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveAsset('${a?a.id:''}')">保存</button></div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
}

function saveAsset(id){
  const name=document.getElementById('aName').value.trim();
  const type=document.getElementById('aType').value;
  const balance=parseFloat(document.getElementById('aBalance').value)||0;
  if(!name){toast('请输入账户名称');return;}
  if(id){const i=assets.findIndex(x=>x.id===id);if(i>=0){assets[i]={...assets[i],name,type,balance};}}
  else{assets.push({id:genId(),name,type,balance,transactions:[]});}
  sA();closeModal();renderAssets();if(curTab==='overview')renderOverview();
  toast('账户已保存');
}

function adjustAsset(id){
  const a=assets.find(x=>x.id===id);if(!a)return;
  document.getElementById('modalTitle').textContent=`余额变动 - ${a.name}`;
  document.getElementById('modalBody').innerHTML=`
    <p style="margin-bottom:10px;font-size:13px;color:var(--gray-500);">当前余额：<strong>${fm(a.balance)}</strong></p>
    <div class="form-group"><label>变动金额（正数=增加，负数=减少）</label><input id="adjAmount" type="number" step="0.01" placeholder="如 +1000 或 -500"></div>
    <div class="form-group"><label>备注（可选）</label><input id="adjNote" placeholder="变动原因"></div>
    <div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveAdjust('${id}')">确认</button></div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
}

function saveAdjust(id){
  const a=assets.find(x=>x.id===id);if(!a)return;
  const amt=parseFloat(document.getElementById('adjAmount').value);
  if(!amt||amt===0){toast('请输入有效变动金额');return;}
  const note=document.getElementById('adjNote').value.trim();
  if(!a.transactions)a.transactions=[];
  a.transactions.push({date:today(),amount:amt,note,id:genId()});
  a.balance=Math.round((Number(a.balance)+amt)*100)/100;
  sA();closeModal();renderAssets();if(curTab==='overview')renderOverview();
  toast(`余额已${amt>0?'增加':'减少'} ${fm(Math.abs(amt))}`);
}

function deleteAsset(id){
  if(!confirm('确认删除此账户？'))return;
  assets=assets.filter(x=>x.id!==id);sA();renderAssets();if(curTab==='overview')renderOverview();
  toast('账户已删除');
}

// ===================== DEBT =====================
function getDebtPaid(d){if(!d.isInstallment||!d.installments)return Number(d.paid||0);return d.installments.reduce((s,p)=>s+Number(p.paidAmount||0),0);}

function getDebtStatus(d){
  if(!d.isInstallment||!d.installments||!d.installments.length){
    const rem=Number(d.amount)-Number(d.paid||0);const due=new Date(d.dueDate);const now=new Date();now.setHours(0,0,0,0);
    const days=rem>0?Math.floor((due-now)/86400000):999;return{remain:rem,isOverdue:rem>0&&days<0,isWarning:rem>0&&days>=0&&days<=7,daysLeft:days,isInstallment:false,paidCount:0,totalCount:0,progressPercent:0};
  }
  const plan=d.installments;let paid=0,overdue=0;const now=new Date();now.setHours(0,0,0,0);
  plan.forEach(p=>{const pa=p.paidAmount||0;if(pa>=p.amount)paid++;else if(new Date(p.dueDate)<now)overdue++;});
  const tp=plan.reduce((s,p)=>s+Number(p.paidAmount||0),0);
  const rem=Number(d.amount)-tp;
  return{remain:rem,isOverdue:overdue>0,isWarning:!overdue&&(rem>0),daysLeft:0,isInstallment:true,paidCount:paid,totalCount:plan.length,progressPercent:Math.round(paid/plan.length*100),overdueCount:overdue};
}

function renderDebts(){
  const list=document.getElementById('debtList');
  const sorted=[...debts].sort((a,b)=>{
    const as=getDebtStatus(a),bs=getDebtStatus(b);
    if(as.isOverdue!==bs.isOverdue)return as.isOverdue?-1:1;
    if(as.isWarning!==bs.isWarning)return as.isWarning?-1:1;
    const ad=a.isInstallment?(a.installments?.[0]?.dueDate||'9999'):a.dueDate;
    const bd=b.isInstallment?(b.installments?.[0]?.dueDate||'9999'):b.dueDate;
    return ad.localeCompare(bd);
  });
  let ta=0,tp=0,tr=0,tov=0,ti=0;
  sorted.forEach(d=>{
    const st=getDebtStatus(d);const paid=getDebtPaid(d);ta+=Number(d.amount);tp+=paid;tr+=st.remain;
    if(st.isOverdue)tov++;if(d.isInstallment)ti++;
  });

  if(!sorted.length){list.innerHTML='<div class="empty-state"><div class="icon">&#128203;</div>暂无债务</div>';}
  else{
    list.innerHTML=sorted.map(d=>{
      const st=getDebtStatus(d);const paid=getDebtPaid(d);
      const cls=st.isOverdue?'overdue':(st.isWarning?'warning':'normal');
      const badgeCls=st.isOverdue?'overdue':(st.isWarning?'warning':'normal');
      const badgeText=st.isInstallment
        ?(st.paidCount>=st.totalCount?'已还清':`${st.paidCount}/${st.totalCount}期`)
        :(st.remain<=0?'已还清':(st.isOverdue?`逾期${Math.abs(st.daysLeft)}天`:(st.daysLeft<=7?`${st.daysLeft}天后到期`:'正常')));
      const dueDisplay=d.isInstallment?(d.installments?.[0]?.dueDate||'-'):d.dueDate;
      const progressHtml=st.isInstallment?`<div class="dc-progress"><div class="track"><div class="fill" style="width:${st.progressPercent}%;background:${st.progressPercent>=100?'var(--success)':(st.isOverdue?'var(--danger)':'var(--primary)')}"></div></div></div>`:'';
      return`<div class="debt-card ${cls}" onclick="event.stopPropagation();">
        <span class="reminder-toggle ${d.reminderEnabled?'on':''}" onclick="toggleReminder('${d.id}')">&#128276;</span>
        <div class="dc-top"><span class="dc-creditor">${esc(d.creditor)}</span><span class="dc-amount">${fm(d.amount)}</span></div>
        <div class="dc-remain">剩余待还: <strong class="text-red">${fm(st.remain)}</strong> | 已还: <strong class="text-green">${fm(paid)}</strong></div>
        <div class="dc-due">${d.isInstallment?'首期':'应还日'}: ${dueDisplay} <span class="dc-badge ${badgeCls}">${badgeText}</span></div>
        ${progressHtml}
        <div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap;">
          ${d.isInstallment?`<button class="btn btn-sm btn-warning" onclick="openInstallmentPlan('${d.id}')">分期详情</button>`:`<button class="btn btn-sm btn-primary" onclick="openRepayModal('${d.id}')">还款</button>`}
          <button class="btn btn-sm btn-outline" onclick="openDebtModal('${d.id}')">编辑</button>
          <button class="btn btn-sm btn-danger" onclick="deleteDebt('${d.id}')">删除</button>
        </div>
      </div>`;
    }).join('');
  }
  document.getElementById('dbTotal').textContent=fm(ta);
  document.getElementById('dbPaid').textContent=fm(tp);
  document.getElementById('dbRemain').textContent=fm(tr);
  document.getElementById('dbOverdue').textContent=tov;
  document.getElementById('dbInstallment').textContent=ti;
  if(curTab==='overview')renderOverview();
}

function toggleReminder(id){
  const d=debts.find(x=>x.id===id);if(!d)return;
  if(!d.reminderEnabled&&Notification.permission==='default'){Notification.requestPermission().then(p=>{if(p==='granted'){d.reminderEnabled=true;sD();renderDebts();}});return;}
  d.reminderEnabled=!d.reminderEnabled;sD();renderDebts();
  toast(d.reminderEnabled?'还款提醒已开启':'还款提醒已关闭');
}

function generateInstallmentPlan(amount,count,day,startDate){
  const per=Math.round((amount/count)*100)/100;
  const lastAmt=Math.round((amount-per*(count-1))*100)/100;
  const base=startDate?new Date(startDate):new Date();
  let fm=new Date(base.getFullYear(),base.getMonth(),day);
  if(fm<=base)fm=new Date(base.getFullYear(),base.getMonth()+1,day);
  const plan=[];for(let i=0;i<count;i++){const d=new Date(fm.getFullYear(),fm.getMonth()+i,day);plan.push({period:i+1,dueDate:d.toISOString().slice(0,10),amount:i===count-1?lastAmt:per,paidAmount:0,repayments:[]});}return plan;
}

function calcInstallmentStatus(plan){
  let pc=0,oc=0;const now=new Date();now.setHours(0,0,0,0);
  plan.forEach(p=>{if((p.paidAmount||0)>=p.amount)pc++;const rem=p.amount-(p.paidAmount||0);if(rem>0&&new Date(p.dueDate)<now)oc++;});
  return{paidCount:pc,overdueCount:oc,total:plan.length,progressPercent:Math.round(pc/plan.length*100)};
}

function openDebtModal(id){
  const d=id?debts.find(x=>x.id===id):null;
  const v=d||{creditor:'',amount:'',rate:'',startDate:'',dueDate:'',paid:'',note:'',isInstallment:false,installmentCount:'3',installmentDay:'15',reminderEnabled:false};
  document.getElementById('modalContent').classList.remove('modal-wide');
  document.getElementById('modalTitle').textContent=d?'编辑债务':'新增债务';
  const chk=v.isInstallment?'checked':'';
  const show=v.isInstallment?'show':'';
  const countOps=Array.from({length:36},(_,i)=>{const n=i+1;return`<option value="${n}" ${Number(v.installmentCount)===n?'selected':''}>${n}期</option>`;}).join('');
  const dayOps=Array.from({length:28},(_,i)=>`<option value="${i+1}" ${Number(v.installmentDay)===i+1?'selected':''}>${i+1}号</option>`).join('');
  const per=v.isInstallment&&Number(v.amount)>0?Math.round(Number(v.amount)/Number(v.installmentCount||3)*100)/100:0;
  document.getElementById('modalBody').innerHTML=`
    <div class="form-group"><label>债权人名称</label><input id="fCreditor" value="${esc(v.creditor)}"></div>
    <div class="form-row"><div class="form-group"><label>债务金额</label><input id="fAmount" type="number" step="0.01" min="0" value="${v.amount}" oninput="updateInstallmentCalc()"></div>
    <div class="form-group"><label>利率（可选）</label><input id="fRate" value="${esc(v.rate)}" placeholder="如 5%"></div></div>
    <div class="form-row"><div class="form-group"><label>借款日期</label><input id="fStartDate" type="date" value="${v.startDate||''}"></div>
    <div class="form-group"><label>应还日期${v.isInstallment?'（首期）':''}</label><input id="fDueDate" type="date" value="${v.dueDate||today()}"></div></div>
    ${!v.isInstallment?`<div class="form-group"><label>已还金额</label><input id="fPaid" type="number" step="0.01" value="${v.paid||0}"></div>`:''}
    <div class="form-group"><label>备注</label><textarea id="fNote" rows="2">${esc(v.note||'')}</textarea></div>
    <div class="toggle-wrap"><label class="toggle"><input type="checkbox" id="fInstallment" ${chk} onchange="toggleInstallmentFields()"><span class="slider"></span></label><label>分期还款</label></div>
    <div class="installment-section ${show}" id="installmentSection">
      <div class="form-row"><div class="form-group"><label>分期期数</label><select id="fICount" onchange="updateInstallmentCalc()">${countOps}</select></div>
      <div class="form-group"><label>每期还款日</label><select id="fIDay">${dayOps}</select></div></div>
      <div class="installment-calc" id="instCalc">每期应还：<span class="highlight">${fm(per)}</span>${per>0?`<span style="color:var(--gray-400);font-size:11px;">（${v.installmentCount||3}期）</span>`:''}</div>
    </div>
    <div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveDebt('${d?d.id:''}')">保存</button></div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
}

function toggleInstallmentFields(){
  document.getElementById('installmentSection').classList.toggle('show',document.getElementById('fInstallment').checked);
  document.querySelectorAll('#modalBody .form-group').forEach(g=>{if(g.querySelector('label')?.textContent==='已还金额')g.style.display=document.getElementById('fInstallment').checked?'none':'block';});
  updateInstallmentCalc();
}

function updateInstallmentCalc(){

function saveDebt(id){
  const cr=document.getElementById('fCreditor').value.trim();
  const amt=parseFloat(document.getElementById('fAmount').value);
  const rate=document.getElementById('fRate').value.trim();
  const sd=document.getElementById('fStartDate').value;
  const dd=document.getElementById('fDueDate').value;
  const note=document.getElementById('fNote').value.trim();
  const isInst=document.getElementById('fInstallment').checked;
  if(!cr){toast('请输入债权人名称');return;}if(!amt||amt<=0){toast('请输入金额');return;}
  if(isInst){
    const ct=parseInt(document.getElementById('fICount').value)||3;const day=parseInt(document.getElementById('fIDay').value)||15;
    if(id){const i=debts.findIndex(x=>x.id===id);if(i>=0){const o=debts[i];const sp=o.isInstallment&&o.installmentCount===ct&&o.installmentDay===day&&o.startDate===sd&&Number(o.amount)===amt;
    const plan=sp?o.installments:generateInstallmentPlan(amt,ct,day,sd);debts[i]={...o,creditor:cr,amount:amt,rate,sd?sd:sd,startDate:sd,dueDate:dd,note,isInstallment:true,installmentCount:ct,installmentDay:day,installments:plan,paid:plan.reduce((s,p)=>s+Number(p.paidAmount||0),0),reminderEnabled:o.reminderEnabled};}}
    else{const plan=generateInstallmentPlan(amt,ct,day,sd);debts.push({id:genId(),creditor:cr,amount:amt,rate,startDate:sd,dueDate:dd,note,isInstallment:true,installmentCount:ct,installmentDay:day,installments:plan,paid:0,reminderEnabled:false});}
  }else{
    const paid=parseFloat(document.getElementById('fPaid')?.value)||0;
    if(id){const i=debts.findIndex(x=>x.id===id);if(i>=0){debts[i]={...debts[i],creditor:cr,amount:amt,rate,startDate:sd,dueDate:dd,paid,note,isInstallment:false};delete debts[i].installments;delete debts[i].installmentCount;delete debts[i].installmentDay;}}
    else{debts.push({id:genId(),creditor:cr,amount:amt,rate,startDate:sd,dueDate:dd,paid,note,isInstallment:false,reminderEnabled:false});}
  }
  sD();closeModal();renderDebts();toast('已保存');
}

// ===================== INSTALLMENT PLAN =====================
function openInstallmentPlan(debtId){
  const d=debts.find(x=>x.id===debtId);if(!d||!d.installments)return;
  const plan=d.installments;const st=calcInstallmentStatus(plan);
  document.getElementById('modalContent').classList.add('modal-wide');
  document.getElementById('modalTitle').textContent=`分期详情 - ${d.creditor}`;
  const blocks=plan.map(p=>{const pa=p.paidAmount||0;const rem=p.amount-pa;const cls=pa>=p.amount?'green':(rem>0&&new Date(p.dueDate)<new Date(new Date().setHours(0,0,0,0))?'red':(pa>0?'yellow':'gray'));return`<div class="block ${cls}" title="第${p.period}期 ${p.dueDate} ${fm(p.amount)}"></div>`;}).join('');
  const rows=plan.map(p=>{const pa=p.paidAmount||0;const rem=p.amount-pa;const cls=pa>=p.amount?'green':(rem>0&&new Date(p.dueDate)<new Date(new Date().setHours(0,0,0,0))?'red':(pa>0?'yellow':'gray'));let stText='未还';if(pa>=p.amount)stText='已还';else if(pa>0)stText=`部分还 ${fm(pa)}`;else if(cls==='red')stText='逾期';
  return`<tr><td>${p.period}</td><td>${p.dueDate}</td><td>${fm(p.amount)}</td><td>${fm(pa)}</td><td class="${rem>0?'text-red':'text-green'}">${fm(rem)}</td><td><span class="badge badge-${cls==='green'?'green':(cls==='red'?'red':'yellow')}">${stText}</span></td><td>${rem>0?`<button class="btn btn-sm btn-primary" onclick="openInstRepay('${debtId}',${p.period})">还款</button>`:'-'}</td></tr>`;}).join('');
  document.getElementById('modalBody').innerHTML=`<div class="block-grid" style="margin-bottom:12px;">${blocks}</div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--gray-500);margin-bottom:8px;"><span>绿色=已还 | 红色=逾期 | 黄色=部分还 | 灰色=未还</span><span>${st.paidCount}/${st.total}期已还</span></div>
    <div class="table-wrap"><table><thead><tr><th>期数</th><th>应还日</th><th>金额</th><th>已还</th><th>剩余</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">关闭</button></div>`;
  document.getElementById('modalOverlay').classList.add('show');
}

function openInstRepay(debtId,period){
  const d=debts.find(x=>x.id===debtId);if(!d)return;const p=d.installments.find(x=>x.period===period);if(!p)return;
  const rem=p.amount-(p.paidAmount||0);
  document.getElementById('modalTitle').textContent=`第${period}期还款 - ${d.creditor}`;
  document.getElementById('modalBody').innerHTML=`<p style="margin-bottom:10px;font-size:13px;">本期应还：<strong>${fm(p.amount)}</strong> | 剩余：<strong class="text-red">${fm(rem)}</strong></p>
    <div class="form-group"><label>金额</label><input id="irAmt" type="number" step="0.01" min="0.01" max="${rem}"></div>
    <div class="form-row"><div class="form-group"><label>日期</label><input id="irDate" type="date" value="${today()}"></div><div class="form-group"><label>方式</label><select id="irMethod"><option>转账</option><option>现金</option><option>微信</option><option>支付宝</option><option>银行</option></select></div></div>
    <div class="form-actions"><button class="btn btn-outline" onclick="openInstallmentPlan('${debtId}')">返回</button><button class="btn btn-primary" onclick="submitInstRepay('${debtId}',${period})">确认</button></div>`;

function submitInstRepay(debtId,period){
  const d=debts.find(x=>x.id===debtId);if(!d)return;const p=d.installments.find(x=>x.period===period);if(!p)return;
  const amt=parseFloat(document.getElementById('irAmt').value);if(!amt||amt<=0){toast('请输入金额');return;}
  const date=document.getElementById('irDate').value||today();const method=document.getElementById('irMethod').value;
  if(!p.repayments)p.repayments=[];p.repayments.push({date,amount:amt,method,id:genId()});p.paidAmount=(p.paidAmount||0)+amt;
  d.paid=d.installments.reduce((s,i)=>s+Number(i.paidAmount||0),0);sD();
  ledger.push({id:genId(),date,type:'支出',category:'债务还款',amount:amt,account:'现金',note:`偿还 ${d.creditor} 第${period}期`,relatedDebtId:debtId});sL();
  toast(`已还款 ${fm(amt)}`);openInstallmentPlan(debtId);renderDebts();
}

// ===================== HEATMAP =====================
function renderHeatmap(){
  const container=document.getElementById('expenseHeatmap');if(!container)return;
  const now=new Date();const ym=now.getMonth();const yr=now.getFullYear();
  const daysInMonth=new Date(yr,ym+1,0).getDate();
  const dailyExp={};ledger.filter(r=>r.type==='支出'&&r.date.slice(0,7)===`${yr}-${String(ym+1).padStart(2,'0')}`).forEach(r=>{dailyExp[r.date]=(dailyExp[r.date]||0)+Number(r.amount);});
  const maxVal=Math.max(1,...Object.values(dailyExp));
  const firstDay=new Date(yr,ym,1).getDay();// 0=Sun
  let html='<div class="cal-heatmap">';
  ['日','一','二','三','四','五','六'].forEach(d=>{html+=`<div class="day-header">${d}</div>`;});
  for(let i=0;i<firstDay;i++)html+='<div></div>';
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${yr}-${String(ym+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const val=dailyExp[dateStr]||0;const ratio=val/maxVal;
    const intensity=ratio===0?'#f1f5f9':`rgba(99,102,241,${Math.max(0.12,ratio*0.85)})`;
    html+=`<div class="day-cell" style="background:${intensity};">
      <span>${d}</span><div class="tooltip">${dateStr}: ${fm(val)}</div></div>`;
  }
  html+='</div>';
  container.innerHTML=`<div style="font-size:11px;color:var(--gray-400);margin-bottom:4px;">${yr}年${ym+1}月</div>${html}`;
}

// ===================== TOOLS =====================
function calcMortgage(){
  const total=parseFloat(document.getElementById('mtTotal').value)||0;
  const rate=parseFloat(document.getElementById('mtRate').value)||0;
  const years=parseInt(document.getElementById('mtYears').value)||20;
  if(!total||!rate){document.getElementById('mortgageResult').innerHTML='';return;}
  const mr=rate/100/12;const months=years*12;
  const monthly=total*mr*Math.pow(1+mr,months)/(Math.pow(1+mr,months)-1);
  const totalPay=monthly*months;const totalInterest=totalPay-total;
  document.getElementById('mortgageResult').innerHTML=`<div class="cr-row"><span>月供</span><span class="cr-value" style="color:var(--primary);font-size:18px;">${fm(monthly)}</span></div><div class="cr-row"><span>总还款</span><span class="cr-value">${fm(totalPay)}</span></div><div class="cr-row"><span>总利息</span><span class="cr-value text-red">${fm(totalInterest)}</span></div>`;
  document.getElementById('btnImportDebt').style.display='inline-flex';
  // store for import
  window._mtData={total,rate,years,monthly,months};
}

function importMortgageAsDebt(){
  const d=window._mtData;if(!d)return;
  const startDate=document.getElementById('mtStartDate').value||today();
  const plan=generateInstallmentPlan(d.total,d.months,Number(startDate.slice(8,10)),startDate);
  debts.push({id:genId(),creditor:'房贷('+d.rate+'%)',amount:d.total,rate:d.rate+'',startDate,dueDate:startDate,note:'等额本息',isInstallment:true,installmentCount:d.months,installmentDay:Number(startDate.slice(8,10)),installments:plan,paid:0,reminderEnabled:false});
  sD();renderDebts();toast('已导入为分期债务');
}

function calcCompound(){
  const p=parseFloat(document.getElementById('ciPrincipal').value)||0;
  const r=parseFloat(document.getElementById('ciRate').value)||0;
  const y=parseInt(document.getElementById('ciYears').value)||0;
  if(!p||!r||!y){document.getElementById('compoundResult').innerHTML='';return;}
  const fv=p*Math.pow(1+r/100,y);const interest=fv-p;
  document.getElementById('compoundResult').innerHTML=`<div class="cr-row"><span>到期本息</span><span class="cr-value" style="color:var(--primary);font-size:18px;">${fm(fv)}</span></div><div class="cr-row"><span>总收益</span><span class="cr-value text-green">${fm(interest)}</span></div><div class="cr-row"><span>收益率</span><span class="cr-value">${((interest/p)*100).toFixed(2)}%</span></div>`;
}

// ===================== NOTIFICATIONS =====================
function checkReminders(){
  if(Notification.permission!=='granted')return;
  const now=new Date();now.setHours(0,0,0,0);
  const tomorrow=new Date(now);tomorrow.setDate(tomorrow.getDate()+1);
  debts.filter(d=>d.reminderEnabled).forEach(d=>{
    if(d.isInstallment&&d.installments){d.installments.forEach(p=>{const rem=p.amount-(p.paidAmount||0);if(rem<=0)return;const pd=new Date(p.dueDate);if(pd.getTime()===tomorrow.getTime()||pd.getTime()===now.getTime()){new Notification('还款提醒',{body:`${d.creditor} 第${p.period}期 ${fm(rem)} 将于${pd.toISOString().slice(0,10)}到期`,icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🔔</text></svg>'});}});}
    else{const rem=Number(d.amount)-Number(d.paid||0);if(rem<=0)return;const pd=new Date(d.dueDate);if(pd.getTime()===tomorrow.getTime()||pd.getTime()===now.getTime()){new Notification('还款提醒',{body:`${d.creditor} ${fm(rem)} 将于${pd.toISOString().slice(0,10)}到期`});}}
  });
}
