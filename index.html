<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>管钱钱</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f7fa; color: #1e293b; line-height: 1.6; padding-bottom: 70px; }

.container { max-width: 800px; margin: 0 auto; padding: 12px; }

/* Header */
.header { background: rgba(255,255,255,.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 14px; padding: 14px 18px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 8px; z-index: 50; }
.header h1 { font-size: 22px; font-weight: 800; background: linear-gradient(135deg, #4f46e5, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.header-btns { display: flex; gap: 6px; }
.icon-btn { width: 36px; height: 36px; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; transition: .2s; color: #475569; }
.icon-btn:hover { background: #e2e8f0; transform: scale(1.05); }
.icon-btn.danger:hover { background: #fee2e2; color: #dc2626; }

/* Nav */
.nav { display: flex; background: rgba(255,255,255,.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 14px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06); overflow: hidden; position: sticky; top: 64px; z-index: 49; }
.nav-item { flex: 1; text-align: center; padding: 11px 0; cursor: pointer; font-size: 13px; font-weight: 600; color: #94a3b8; transition: .2s; border-bottom: 2.5px solid transparent; position: relative; }
.nav-item:hover { color: #4f46e5; background: #f5f3ff; }
.nav-item.active { color: #4f46e5; border-bottom-color: #4f46e5; background: #f5f3ff; }
.nav-item .nav-icon { display: block; font-size: 18px; margin-bottom: 1px; }

/* Pages */
.page { display: none; animation: fadeUp .25s ease; }
.page.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.card-title { font-size: 15px; font-weight: 700; color: #475569; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
.card-title .badge { font-size: 12px; background: #e2e8f0; padding: 2px 10px; border-radius: 20px; font-weight: 500; color: #64748b; }

/* Gradient Summary Cards */
.summary-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.summary-card { border-radius: 14px; padding: 16px; color: #fff; position: relative; overflow: hidden; }
.summary-card::after { content: ''; position: absolute; top: -50%; right: -30%; width: 80%; height: 120%; background: rgba(255,255,255,.08); border-radius: 50%; }
.summary-card .label { font-size: 12px; opacity: .85; margin-bottom: 4px; }
.summary-card .value { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
.summary-card .sub { font-size: 11px; opacity: .75; margin-top: 4px; }
.summary-card.green { background: linear-gradient(135deg, #059669, #10b981); }
.summary-card.red { background: linear-gradient(135deg, #dc2626, #ef4444); }
.summary-card.blue { background: linear-gradient(135deg, #2563eb, #3b82f6); }
.summary-card.purple { background: linear-gradient(135deg, #7c3aed, #8b5cf6); }

/* Debt Status */
.debt-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
.debt-stat { background: #fff; border-radius: 12px; padding: 10px 6px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.debt-stat .num { font-size: 16px; font-weight: 700; }
.debt-stat .lbl { font-size: 10px; color: #94a3b8; margin-top: 2px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 8px 16px; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; transition: .2s; }
.btn-primary { background: #4f46e5; color: #fff; }
.btn-primary:hover { background: #4338ca; transform: translateY(-1px); }
.btn-success { background: #059669; color: #fff; }
.btn-success:hover { background: #047857; }
.btn-danger { background: #ef4444; color: #fff; }
.btn-danger:hover { background: #dc2626; }
.btn-outline { background: transparent; color: #4f46e5; border: 1.5px solid #4f46e5; }
.btn-outline:hover { background: #f5f3ff; }
.btn-sm { padding: 5px 12px; font-size: 12px; border-radius: 8px; }
.btn-block { width: 100%; justify-content: center; padding: 12px; }

/* Form */
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 4px; }
.form-control { width: 100%; padding: 10px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 15px; outline: none; transition: .2s; background: #fff; }
.form-control:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
.form-control-sm { padding: 6px 10px; font-size: 13px; }
select.form-control { appearance: auto; }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 999; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(2px); }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: 18px; padding: 24px; width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto; animation: modalIn .25s ease; }
@keyframes modalIn { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
.modal-close { width: 32px; height: 32px; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; }

/* Asset Cards */
.asset-grid { display: grid; gap: 8px; }
.asset-item { display: flex; align-items: center; padding: 14px 16px; background: #f8fafc; border-radius: 12px; gap: 12px; transition: .2s; cursor: pointer; }
.asset-item:hover { background: #f1f5f9; }
.asset-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.asset-icon.alipay { background: #e8f4fd; color: #1677ff; }
.asset-icon.wechat { background: #e8f8e8; color: #07c160; }
.asset-icon.bank { background: #fef3c7; color: #d97706; }
.asset-icon.cash { background: #f3e8ff; color: #7c3aed; }
.asset-icon.other { background: #f1f5f9; color: #64748b; }
.asset-info { flex: 1; min-width: 0; }
.asset-info .name { font-weight: 600; font-size: 15px; }
.asset-info .type { font-size: 12px; color: #94a3b8; }
.asset-info .bal { font-weight: 700; font-size: 17px; color: #059669; }

/* Debt Cards */
.debt-grid { display: grid; gap: 8px; }
.debt-card { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); position: relative; overflow: hidden; border-left: 4px solid; transition: .2s; }
.debt-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.1); }
.debt-card.normal { border-left-color: #10b981; }
.debt-card.warning { border-left-color: #f59e0b; }
.debt-card.overdue { border-left-color: #ef4444; }
.debt-card .d-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.debt-card .d-name { font-weight: 700; font-size: 16px; }
.debt-card .d-badge { font-size: 11px; padding: 2px 10px; border-radius: 20px; font-weight: 600; }
.debt-card .d-badge.normal { background: #d1fae5; color: #059669; }
.debt-card .d-badge.warning { background: #fef3c7; color: #d97706; }
.debt-card .d-badge.overdue { background: #fee2e2; color: #dc2626; }
.debt-card .d-body { display: flex; gap: 16px; flex-wrap: wrap; }
.debt-card .d-body > div { flex: 1; min-width: 80px; }
.debt-card .d-body .lbl { font-size: 11px; color: #94a3b8; }
.debt-card .d-body .val { font-size: 16px; font-weight: 700; color: #1e293b; }
.debt-card .d-body .val.red { color: #ef4444; }
.debt-card .d-actions { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.debt-card .reminder-toggle { position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; transition: .2s; }
.debt-card .reminder-toggle.on { background: #dbeafe; color: #2563eb; }

/* Installment Plan Grid */
.install-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(32px, 1fr)); gap: 4px; margin: 12px 0; }
.install-cell { aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; cursor: pointer; transition: .15s; }
.install-cell.paid { background: #10b981; color: #fff; }
.install-cell.partial { background: #f59e0b; color: #fff; }
.install-cell.pending { background: #e2e8f0; color: #64748b; }
.install-cell.overdue { background: #ef4444; color: #fff; }
.install-cell:hover { transform: scale(1.1); }
.install-legend { display: flex; gap: 12px; font-size: 12px; margin-top: 8px; flex-wrap: wrap; }
.install-legend span { display: flex; align-items: center; gap: 4px; }
.install-legend .dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* Ledger */
.ledger-filter { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
.ledger-filter input, .ledger-filter select { padding: 6px 10px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 13px; outline: none; }
.ledger-filter input:focus, .ledger-filter select:focus { border-color: #4f46e5; }
.ledger-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #f1f5f9; gap: 10px; }
.ledger-item:last-child { border-bottom: none; }
.ledger-item .li-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.ledger-item .li-icon.income { background: #d1fae5; color: #059669; }
.ledger-item .li-icon.expense { background: #fee2e2; color: #ef4444; }
.ledger-item .li-info { flex: 1; min-width: 0; }
.ledger-item .li-info .cat { font-weight: 600; font-size: 14px; }
.ledger-item .li-info .note { font-size: 12px; color: #94a3b8; }
.ledger-item .li-amount { font-weight: 700; font-size: 16px; }
.ledger-item .li-amount.income { color: #059669; }
.ledger-item .li-amount.expense { color: #ef4444; }
.ledger-item .li-date { font-size: 11px; color: #94a3b8; min-width: 50px; text-align: right; }

/* Calendar Heatmap */
.cal-heatmap { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin: 10px 0; }
.cal-heatmap .day-label { font-size: 10px; color: #94a3b8; text-align: center; padding: 2px; }
.cal-heatmap .cal-cell { aspect-ratio: 1; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; cursor: default; transition: .1s; }
.cal-heatmap .cal-cell.level-0 { background: #f1f5f9; color: #94a3b8; }
.cal-heatmap .cal-cell.level-1 { background: #bbf7d0; color: #166534; }
.cal-heatmap .cal-cell.level-2 { background: #86efac; color: #14532d; }
.cal-heatmap .cal-cell.level-3 { background: #4ade80; color: #052e16; }
.cal-heatmap .cal-cell.level-4 { background: #22c55e; color: #052e16; }
.cal-heatmap .cal-cell.level-5 { background: #16a34a; color: #fff; }
.cal-heatmap .cal-cell.outside { opacity: .3; }

/* Chart containers */
.chart-box { position: relative; height: 200px; margin: 10px 0; }
.chart-box-sm { height: 160px; margin: 8px 0; }

/* Tools */
.tool-grid { display: grid; gap: 10px; }
.tool-card { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.tool-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.calc-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.calc-row .form-group { flex: 1; min-width: 100px; }
.calc-result { background: #f1f5f9; border-radius: 10px; padding: 12px; margin-top: 8px; }
.calc-result .cr-item { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; }
.calc-result .cr-item .cr-label { color: #64748b; }
.calc-result .cr-item .cr-value { font-weight: 700; }

/* Table */
.table-wrap { overflow-x: auto; margin-top: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #f1f5f9; }
th { font-weight: 600; color: #64748b; background: #f8fafc; position: sticky; top: 0; }
tr:hover td { background: #f8fafc; }

/* Toast */
.toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 10px 20px; border-radius: 12px; font-size: 14px; z-index: 9999; opacity: 0; transition: .3s; pointer-events: none; white-space: nowrap; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
.toast.show { opacity: 1; }

/* Responsive */
@media (max-width: 500px) {
  .summary-grid { grid-template-columns: 1fr; }
  .debt-stats { grid-template-columns: repeat(3, 1fr); }
  .nav-item { font-size: 11px; padding: 8px 0; }
  .nav-item .nav-icon { font-size: 16px; }
  .debt-card .d-body { gap: 8px; }
  .calc-row .form-group { min-width: 80px; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }

/* Empty state */
.empty-state { text-align: center; padding: 30px 20px; color: #94a3b8; }
.empty-state .icon { font-size: 48px; margin-bottom: 8px; opacity: .5; }
.empty-state p { font-size: 14px; }
</style>
</head>
<body>
<div class="container" id="app">
  <!-- Header -->
  <div class="header">
    <h1>💰 管钱钱</h1>
    <div class="header-btns">
      <button class="icon-btn" onclick="exportCSV()" title="导出CSV">📤</button>
      <button class="icon-btn danger" onclick="confirmClearAll()" title="一键清空">🗑️</button>
    </div>
  </div>

  <!-- Nav -->
  <div class="nav" id="navTabs">
    <div class="nav-item active" data-tab="overview" onclick="switchTab('overview')"><span class="nav-icon">📊</span>概览</div>
    <div class="nav-item" data-tab="assets" onclick="switchTab('assets')"><span class="nav-icon">🏦</span>资产</div>
    <div class="nav-item" data-tab="debts" onclick="switchTab('debts')"><span class="nav-icon">📋</span>还债本</div>
    <div class="nav-item" data-tab="ledger" onclick="switchTab('ledger')"><span class="nav-icon">📝</span>记账本</div>
    <div class="nav-item" data-tab="tools" onclick="switchTab('tools')"><span class="nav-icon">🔧</span>工具</div>
  </div>

  <!-- ========== OVERVIEW PAGE ========== -->
  <div class="page active" id="page-overview">
    <div class="summary-grid" id="summaryCards">
      <div class="summary-card green">
        <div class="label">总资产</div>
        <div class="value" id="ovTotalAssets">¥0.00</div>
        <div class="sub">所有账户余额合计</div>
      </div>
      <div class="summary-card red">
        <div class="label">总负债</div>
        <div class="value" id="ovTotalDebts">¥0.00</div>
        <div class="sub">未还债务合计</div>
      </div>
      <div class="summary-card blue">
        <div class="label">净资产</div>
        <div class="value" id="ovNetWorth">¥0.00</div>
        <div class="sub">资产 - 负债</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">本月账单 <span class="badge" id="ovMonthLabel">2026年7月</span></div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;">
        <div><span style="color:#94a3b8;font-size:13px;">本月待还</span><br><span style="font-size:20px;font-weight:700;color:#ef4444;" id="ovMonthDue">¥0.00</span></div>
        <div><span style="color:#94a3b8;font-size:13px;">本月已还</span><br><span style="font-size:20px;font-weight:700;color:#059669;" id="ovMonthPaid">¥0.00</span></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">资产变动趋势</div>
      <div class="chart-box"><canvas id="chartAssetTrend"></canvas></div>
    </div>

    <div class="card">
      <div class="card-title">负债变动趋势</div>
      <div class="chart-box"><canvas id="chartDebtTrend"></canvas></div>
    </div>
  </div>

  <!-- ========== ASSETS PAGE ========== -->
  <div class="page" id="page-assets">
    <div class="card">
      <div class="card-title">
        我的资产账户
        <button class="btn btn-primary btn-sm" onclick="openAssetModal()">+ 添加</button>
      </div>
      <div id="assetList" class="asset-grid"></div>
    </div>
  </div>

  <!-- ========== DEBTS PAGE ========== -->
  <div class="page" id="page-debts">
    <div class="debt-stats" id="debtStats">
      <div class="debt-stat"><div class="num" id="dsTotal">0</div><div class="lbl">总债务</div></div>
      <div class="debt-stat"><div class="num" id="dsPaid">0</div><div class="lbl">已还清</div></div>
      <div class="debt-stat"><div class="num" id="dsRemain">0</div><div class="lbl">剩余</div></div>
      <div class="debt-stat"><div class="num" style="color:#ef4444;" id="dsOverdue">0</div><div class="lbl">逾期</div></div>
      <div class="debt-stat"><div class="num" id="dsInstall">0</div><div class="lbl">分期中</div></div>
    </div>
    <div class="card">
      <div class="card-title">
        我的债务
        <button class="btn btn-primary btn-sm" onclick="openDebtModal()">+ 添加</button>
      </div>
      <div id="debtList" class="debt-grid"></div>
    </div>
  </div>

  <!-- ========== LEDGER PAGE ========== -->
  <div class="page" id="page-ledger">
    <div class="card">
      <div class="card-title">
        收支记录
        <button class="btn btn-primary btn-sm" onclick="openLedgerModal()">+ 记一笔</button>
      </div>
      <div class="ledger-filter">
        <input type="date" id="ledgerDateFrom" onchange="renderLedger()">
        <input type="date" id="ledgerDateTo" onchange="renderLedger()">
        <select id="ledgerTypeFilter" onchange="renderLedger()"><option value="">全部</option><option value="income">收入</option><option value="expense">支出</option></select>
        <button class="btn btn-outline btn-sm" onclick="document.getElementById('ledgerDateFrom').value='';document.getElementById('ledgerDateTo').value='';document.getElementById('ledgerTypeFilter').value='';renderLedger();">重置</button>
      </div>
      <div id="ledgerList"></div>
    </div>
    <div class="card">
      <div class="card-title">支出分类占比</div>
      <div class="chart-box-sm"><canvas id="chartPie"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">每日收支趋势</div>
      <div class="chart-box-sm"><canvas id="chartDaily"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">月度支出热力图</div>
      <div id="heatmapContainer"></div>
    </div>
  </div>

  <!-- ========== TOOLS PAGE ========== -->
  <div class="page" id="page-tools">
    <div class="tool-grid">
      <!-- 房贷计算器 -->
      <div class="tool-card">
        <h3>🏠 房贷计算器</h3>
        <div class="calc-row">
          <div class="form-group"><label>贷款总额(元)</label><input class="form-control form-control-sm" id="mortgageAmount" value="1000000" type="number"></div>
          <div class="form-group"><label>年利率(%)</label><input class="form-control form-control-sm" id="mortgageRate" value="3.85" type="number" step="0.01"></div>
          <div class="form-group"><label>年限</label><input class="form-control form-control-sm" id="mortgageYears" value="30" type="number"></div>
        </div>
        <div style="display:flex;gap:6px;margin-bottom:8px;">
          <button class="btn btn-primary btn-sm" onclick="calcMortgage()">计算</button>
          <button class="btn btn-outline btn-sm" onclick="importMortgageToDebt()">导入为债务</button>
        </div>
        <div class="calc-result" id="mortgageResult"></div>
        <div class="table-wrap" id="mortgageTableWrap" style="display:none;max-height:240px;overflow-y:auto;"></div>
      </div>

      <!-- 复利计算器 -->
      <div class="tool-card">
        <h3>📈 复利计算器</h3>
        <div class="calc-row">
          <div class="form-group"><label>本金(元)</label><input class="form-control form-control-sm" id="compoundPrincipal" value="10000" type="number"></div>
          <div class="form-group"><label>年利率(%)</label><input class="form-control form-control-sm" id="compoundRate" value="5" type="number" step="0.1"></div>
          <div class="form-group"><label>年限</label><input class="form-control form-control-sm" id="compoundYears" value="10" type="number"></div>
        </div>

      <option value="餐饮">🍔 餐饮</option><option value="交通">🚗 交通</option><option value="购物">🛒 购物</option><option value="娱乐">🎮 娱乐</option><option value="住房">🏠 住房</option><option value="医疗">💊 医疗</option><option value="教育">📚 教育</option><option value="通讯">📱 通讯</option><option value="工资">💰 工资</option><option value="理财">📈 理财</option><option value="兼职">💼 兼职</option><option value="红包">🧧 红包</option><option value="其他">📦 其他</option>

<!-- Confirm Modal -->
<div class="modal-overlay" id="confirmModal"><div class="modal">
  <div class="modal-title">确认操作</div>
  <p id="confirmMsg" style="margin-bottom:16px;font-size:15px;color:#475569;"></p>
  <div style="display:flex;gap:8px;"><button class="btn btn-danger btn-block" id="confirmBtn" onclick="">确认</button><button class="btn btn-outline btn-block" onclick="closeModal('confirmModal')">取消</button></div>
</div></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============ DATA LAYER ============
const STORAGE_KEYS = { assets: 'fin_assets', debts: 'fin_debts_v2', ledger: 'fin_ledger_v2' };

function loadData(key) {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEYS[key])) || []; } catch(e) { return []; }
}
function saveData(key, data) {
  localStorage.setItem(STORAGE_KEYS[key], JSON.stringify(data));
}

let assets = loadData('assets');
let debts = loadData('debts');
let ledger = loadData('ledger');

// ============ TOAST ============
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ============ TAB SWITCH ============
function switchTab(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  document.querySelector(`.nav-item[data-tab="${tab}"]`).classList.add('active');
  if (tab === 'overview') renderOverview();
  if (tab === 'assets') renderAssets();
  if (tab === 'debts') renderDebts();
  if (tab === 'ledger') renderLedger();
  // Chart resize
  setTimeout(() => { window.dispatchEvent(new Event('resize')); }, 100);
}

// ============ MODAL ============
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); });
});

// ============ CONFIRM ============
function showConfirm(msg, cb) {
  document.getElementById('confirmMsg').textContent = msg;
  document.getElementById('confirmBtn').onclick = function() { closeModal('confirmModal'); cb(); };
  openModal('confirmModal');
}

// ============ OVERVIEW ============
let chartAssetTrend = null, chartDebtTrend = null;

function renderOverview() {
  const totalAssets = assets.reduce((s, a) => s + (parseFloat(a.balance) || 0), 0);
  const totalDebts = debts.reduce((s, d) => s + (parseFloat(d.amount) || 0) - (parseFloat(d.paid) || 0), 0);
  const netWorth = totalAssets - totalDebts;
  document.getElementById('ovTotalAssets').textContent = '¥' + totalAssets.toFixed(2);
  document.getElementById('ovTotalDebts').textContent = '¥' + totalDebts.toFixed(2);
  document.getElementById('ovNetWorth').textContent = '¥' + netWorth.toFixed(2);

  // Month
  const now = new Date();
  const ym = now.getFullYear() + '年' + (now.getMonth() + 1) + '月';
  document.getElementById('ovMonthLabel').textContent = ym;
  const monthDue = debts.reduce((s, d) => {
    if (d.installCount && d.installCount > 1) {
      const perInstall = (parseFloat(d.amount) || 0) / d.installCount;
      return s + perInstall;
    }
    return s + (parseFloat(d.amount) || 0) - (parseFloat(d.paid) || 0);
  }, 0);
  document.getElementById('ovMonthDue').textContent = '¥' + monthDue.toFixed(2);
  const monthPaid = debts.reduce((s, d) => s + (parseFloat(d.paid) || 0), 0);
  document.getElementById('ovMonthPaid').textContent = '¥' + monthPaid.toFixed(2);

  // Trend charts
  renderTrendChart('chartAssetTrend', '资产', totalAssets, '#10b981', (i) => {
    let val = totalAssets;
    // Simulate historical: random walk around current
    const months = ['2月','3月','4月','5月','6月','7月'];
    const seed = i * 12345;
    const r = (Math.sin(seed) * 0.5 + 0.5) * 0.4 + 0.8;
    return Math.max(0, val * r);
  });
  renderTrendChart('chartDebtTrend', '负债', totalDebts, '#ef4444', (i) => {
    let val = totalDebts;
    const months = ['2月','3月','4月','5月','6月','7月'];
    const r = (Math.cos(i * 789) * 0.3 + 0.85);
    return Math.max(0, val * r);
  });
}

function renderTrendChart(canvasId, label, currentVal, color, computeFn) {
  const months = ['2月','3月','4月','5月','6月','7月'];
  const data = months.map((_, i) => computeFn(i));

  const ctx = document.getElementById(canvasId).getContext('2d');
  const chart = (canvasId === 'chartAssetTrend') ? chartAssetTrend : chartDebtTrend;
  if (chart) chart.destroy();

  const newChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: months,
      datasets: [{
        label: label,
        data: data,
        borderColor: color,
        backgroundColor: color + '20',
        fill: true,
        tension: .4,
        pointRadius: 4,
        pointHoverRadius: 6,
        borderWidth: 2.5,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, ticks: { callback: v => '¥' + v.toFixed(0) } },
        x: { grid: { display: false } }
      }
    }
  });
  if (canvasId === 'chartAssetTrend') chartAssetTrend = newChart;
  else chartDebtTrend = newChart;
}

// ============ ASSETS ============
function renderAssets() {
  const list = document.getElementById('assetList');
  if (assets.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="icon">🏦</div><p>还没有资产账户，点击右上角添加</p></div>';
    return;
  }
  const iconMap = { alipay: ['💳', 'alipay'], wechat: ['💬', 'wechat'], bank: ['🏛️', 'bank'], cash: ['💵', 'cash'], other: ['📦', 'other'] };
  list.innerHTML = assets.map((a, i) => {
    const ic = iconMap[a.type] || iconMap.other;
    return `<div class="asset-item" onclick="openAssetBalModal(${i})">
      <div class="asset-icon ${ic[1]}">${ic[0]}</div>
      <div class="asset-info"><div class="name">${esc(a.name)}</div><div class="type">${a.type === 'alipay' ? '支付宝' : a.type === 'wechat' ? '微信' : a.type === 'bank' ? '银行卡' : a.type === 'cash' ? '现金' : '其他'}</div></div>
      <div class="bal">¥${(parseFloat(a.balance)||0).toFixed(2)}</div>
      <button class="icon-btn" onclick="event.stopPropagation();deleteAsset(${i})" style="width:28px;height:28px;font-size:12px;">✕</button>
    </div>`;
  }).join('');
}

function openAssetModal(idx) {
  document.getElementById('assetModalTitle').textContent = idx !== undefined ? '编辑资产' : '添加资产';
  document.getElementById('assetName').value = idx !== undefined ? assets[idx].name : '';
  document.getElementById('assetType').value = idx !== undefined ? assets[idx].type : 'alipay';
  document.getElementById('assetBalance').value = idx !== undefined ? assets[idx].balance : '';
  document.getElementById('assetModal').dataset.idx = idx !== undefined ? idx : '';
  openModal('assetModal');
}

function saveAsset() {
  const name = document.getElementById('assetName').value.trim();
  const type = document.getElementById('assetType').value;
  const balance = parseFloat(document.getElementById('assetBalance').value) || 0;
  if (!name) { toast('请输入账户名称'); return; }
  const idx = document.getElementById('assetModal').dataset.idx;
  if (idx !== '') {
    assets[idx] = { ...assets[idx], name, type, balance };
  } else {
    assets.push({ name, type, balance, history: [] });
  }
  saveData('assets', assets);
  closeModal('assetModal');
  renderAssets();
  renderOverview();
  autoBackup();
  toast('保存成功');
}

function deleteAsset(i) {
  showConfirm(`确定删除「${esc(assets[i].name)}」吗？`, () => {
    assets.splice(i, 1);
    saveData('assets', assets);
    renderAssets();
    renderOverview();
    toast('已删除');
  });
}

// Asset Balance History
let _assetBalIdx = -1;
function openAssetBalModal(i) {
  _assetBalIdx = i;
  const a = assets[i];
  document.getElementById('assetBalModalTitle').textContent = `${esc(a.name)} - 余额变动`;
  const hist = a.history || [];
  const container = document.getElementById('assetBalHistory');
  if (hist.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:16px;">暂无变动记录</div>';
  } else {
    container.innerHTML = hist.slice().reverse().map(h =>
      `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:13px;">
        <span style="color:#64748b;">${h.time}</span>
        <span style="font-weight:600;">¥${(h.balance||0).toFixed(2)}</span>
      </div>`
    ).join('');
  }
  document.getElementById('assetBalInput').value = '';
  document.getElementById('assetBalInput').placeholder = '当前 ¥' + (a.balance||0).toFixed(2);
  openModal('assetBalModal');
}

function updateAssetBalance() {
  const val = parseFloat(document.getElementById('assetBalInput').value);
  if (isNaN(val)) { toast('请输入有效金额'); return; }
  const a = assets[_assetBalIdx];
  if (!a.history) a.history = [];
  a.history.push({ balance: val, time: new Date().toLocaleString('zh-CN') });
  a.balance = val;
  saveData('assets', assets);
  renderAssets();
  renderOverview();
  openAssetBalModal(_assetBalIdx);
  toast('余额已更新');
}

// ============ DEBTS ============
function renderDebts() {
  // Stats
  const total = debts.length;
  const paid = debts.filter(d => (parseFloat(d.amount)||0) - (parseFloat(d.paid)||0) <= 0).length;
  const remain = total - paid;
  const overdue = debts.filter(d => d.status === 'overdue').length;
  const install = debts.filter(d => d.installCount && d.installCount > 1).length;
  document.getElementById('dsTotal').textContent = total;
  document.getElementById('dsPaid').textContent = paid;
  document.getElementById('dsRemain').textContent = remain;
  document.getElementById('dsOverdue').textContent = overdue;
  document.getElementById('dsInstall').textContent = install;

  const list = document.getElementById('debtList');
  if (debts.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>还没有债务记录，点击右上角添加</p></div>';
    return;
  }
  list.innerHTML = debts.map((d, i) => {
    const amount = parseFloat(d.amount) || 0;
    const paidAmt = parseFloat(d.paid) || 0;
    const remainAmt = amount - paidAmt;
    const statusClass = d.status === 'overdue' ? 'overdue' : d.status === 'warning' ? 'warning' : 'normal';
    const statusLabel = d.status === 'overdue' ? '逾期' : d.status === 'warning' ? '临近' : '正常';
    const remindOn = d.reminder || false;
    return `<div class="debt-card ${statusClass}">
      <button class="reminder-toggle ${remindOn ? 'on' : ''}" onclick="event.stopPropagation();toggleReminder(${i})">${remindOn ? '🔔' : '🔕'}</button>
      <div class="d-header">
        <div class="d-name">${esc(d.name)}</div>
        <span class="d-badge ${statusClass}">${statusLabel}</span>
      </div>
      <div class="d-body">
        <div><div class="lbl">总金额</div><div class="val">¥${amount.toFixed(2)}</div></div>
        <div><div class="lbl">已还</div><div class="val" style="color:#059669;">¥${paidAmt.toFixed(2)}</div></div>
        <div><div class="lbl">剩余</div><div class="val ${remainAmt > 0 ? 'red' : ''}">¥${Math.max(0,remainAmt).toFixed(2)}</div></div>
        ${d.installCount && d.installCount > 1 ? `<div><div class="lbl">分期</div><div class="val">${d.installCount}期·${d.installDay||1}号</div></div>` : ''}
      </div>
      <div class="d-actions">
        <button class="btn btn-outline btn-sm" onclick="event.stopPropagation();openDebtModal(${i})">编辑</button>
        ${d.installCount && d.installCount > 1 ? `<button class="btn btn-success btn-sm" onclick="event.stopPropagation();openInstallModal(${i})">分期计划</button>` : ''}
        <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteDebt(${i})">删除</button>
      </div>
    </div>`;
  }).join('');
}

function toggleReminder(i) {
  debts[i].reminder = !debts[i].reminder;
  saveData('debts', debts);
  renderDebts();
  if (debts[i].reminder) {
    // Schedule notification - use Notification API
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification('管钱钱 - 还款提醒', { body: `「${debts[i].name}」还款提醒已开启`, icon: '💰' });
    } else if ('Notification' in window && Notification.permission !== 'denied') {
      Notification.requestPermission();
    }
    toast('提醒已开启');
  } else {
    toast('提醒已关闭');
  }
}

function openDebtModal(idx) {
  document.getElementById('debtModalTitle').textContent = idx !== undefined ? '编辑债务' : '添加债务';
  const d = idx !== undefined ? debts[idx] : {};
  document.getElementById('debtName').value = d.name || '';
  document.getElementById('debtAmount').value = d.amount || '';
  document.getElementById('debtPaid').value = d.paid || 0;
  document.getElementById('debtOverdue').value = d.overdue || 0;
  document.getElementById('debtStatus').value = d.status || 'normal';
  document.getElementById('debtInstallCount').value = d.installCount || 1;
  document.getElementById('debtInstallDay').value = d.installDay || 1;
  document.getElementById('debtModal').dataset.idx = idx !== undefined ? idx : '';
  openModal('debtModal');
}

function saveDebt() {
  const name = document.getElementById('debtName').value.trim();
  const amount = parseFloat(document.getElementById('debtAmount').value) || 0;
  const paid = parseFloat(document.getElementById('debtPaid').value) || 0;
  const overdue = parseFloat(document.getElementById('debtOverdue').value) || 0;
  const status = document.getElementById('debtStatus').value;
  const installCount = parseInt(document.getElementById('debtInstallCount').value) || 1;
  const installDay = parseInt(document.getElementById('debtInstallDay').value) || 1;
  if (!name) { toast('请输入债务名称'); return; }
  if (amount <= 0) { toast('请输入有效金额'); return; }
  const idx = document.getElementById('debtModal').dataset.idx;
  if (idx !== '') {
    debts[idx] = { ...debts[idx], name, amount, paid, overdue, status, installCount, installDay };
  } else {
    // Initialize installments with paidAmount and dueAmount
    const perInstallAmount = installCount > 1 ? (amount / installCount) : 0;
    const installs = installCount > 1 ? Array.from({length: installCount}, (_, k) => ({ index: k + 1, status: 'pending', paid: false, paidAmount: 0, dueAmount: perInstallAmount })) : [];
    debts.push({ name, amount, paid, overdue, status, installCount, installDay, reminder: false, installments: installs, created: Date.now() });
  }
  saveData('debts', debts);
  closeModal('debtModal');
  renderDebts();
  renderOverview();
  autoBackup();
  toast('保存成功');
}

function deleteDebt(i) {
  showConfirm(`确定删除「${esc(debts[i].name)}」吗？`, () => {
    debts.splice(i, 1);
    saveData('debts', debts);
    renderDebts();
    renderOverview();
    toast('已删除');
  });
}

// ============ INSTALLMENT ============
let _installDebtIdx = -1;

function openInstallModal(i) {
  _installDebtIdx = i;
  const d = debts[i];
  const perInstall = (parseFloat(d.amount) || 0) / (d.installCount || 1);
  const installs = d.installments || [];
  const fullyPaidCount = installs.filter(x => x.paid).length;
  const partialCount = installs.filter(x => !x.paid && (x.paidAmount || 0) > 0).length;
  const totalPaidAmt = installs.reduce((s, x) => s + (x.paidAmount || 0), 0);

  document.getElementById('installModalTitle').textContent = `${esc(d.name)} - 分期计划`;
  document.getElementById('installInfo').innerHTML =
    `<div style="display:flex;gap:16px;flex-wrap:wrap;">
      <div><span style="color:#94a3b8;font-size:12px;">每期应还</span><br><span style="font-size:18px;font-weight:700;">¥${perInstall.toFixed(2)}</span></div>
      <div><span style="color:#94a3b8;font-size:12px;">总期数</span><br><span style="font-size:18px;font-weight:700;">${d.installCount}期</span></div>
      <div><span style="color:#94a3b8;font-size:12px;">已还清</span><br><span style="font-size:18px;font-weight:700;color:#059669;">${fullyPaidCount}期</span></div>
      <div><span style="color:#94a3b8;font-size:12px;">已还金额</span><br><span style="font-size:16px;font-weight:700;color:#059669;">¥${totalPaidAmt.toFixed(2)}</span></div>
    </div>`;

  const grid = document.getElementById('installGrid');
  grid.innerHTML = installs.map((ins, idx) => {
    let cls = 'pending', tip = '';
    if (ins.paid) { cls = 'paid'; tip = `第${ins.index}期：已还清 ¥${(ins.paidAmount||0).toFixed(2)} / ¥${(ins.dueAmount||perInstall).toFixed(2)}`; }
    else if ((ins.paidAmount || 0) > 0) { cls = 'partial'; tip = `第${ins.index}期：部分还 ¥${(ins.paidAmount||0).toFixed(2)} / ¥${(ins.dueAmount||perInstall).toFixed(2)}`; }
    else if (ins.status === 'overdue') { cls = 'overdue'; tip = `第${ins.index}期：逾期 ¥${(ins.dueAmount||perInstall).toFixed(2)}`; }
    else { tip = `第${ins.index}期：未还 ¥${(ins.dueAmount||perInstall).toFixed(2)}`; }
    // Show a progress indicator inside the cell for partial
    const pct = (ins.paidAmount || 0) / (ins.dueAmount || perInstall);
    const inner = ins.paid ? '✓' : (cls === 'partial' ? Math.round(pct * 100) + '%' : ins.index);
    return `<div class="install-cell ${cls}" onclick="quickPayInstall(${i},${idx})" title="${tip}">${inner}</div>`;
  }).join('');
  openModal('installModal');
}

function quickPayInstall(debtIdx, insIdx, customAmount) {
  const d = debts[debtIdx];
  const ins = d.installments[insIdx];
  const perInstall = ins.dueAmount || ((parseFloat(d.amount) || 0) / (d.installCount || 1));
  const amount = (customAmount !== undefined && customAmount !== null) ? parseFloat(customAmount) : perInstall;
  if (isNaN(amount) || amount <= 0) { toast('请输入有效金额'); return; }
  if (ins.paid) { toast(`第${insIdx+1}期已还清`); return; }

  // Update paidAmount
  ins.paidAmount = (ins.paidAmount || 0) + amount;
  // Round
  ins.paidAmount = Math.round(ins.paidAmount * 100) / 100;

  // Status logic: paidAmount >= dueAmount → paid (已还)
  // paidAmount > 0 and < dueAmount → partial (部分还)
  const due = perInstall;
  if (ins.paidAmount >= due - 0.01) {
    ins.paid = true;
    ins.status = 'paid';
    ins.paidAmount = due; // clamp
  } else {
    ins.paid = false;
    ins.status = 'partial';
  }

  // Update total debt paid amount
  d.paid = d.installments.reduce((s, x) => s + (x.paidAmount || 0), 0);
  d.paid = Math.round(d.paid * 100) / 100;
  if ((parseFloat(d.amount) || 0) - d.paid <= 0.01) {
    d.paid = parseFloat(d.amount) || 0;
    d.status = 'normal';
  }
  saveData('debts', debts);
  openInstallModal(debtIdx);
  renderDebts();
  renderOverview();
  const statusText = ins.paid ? `第${insIdx+1}期已还清` : `第${insIdx+1}期已还 ¥${amount.toFixed(2)}（剩余 ¥${(due - ins.paidAmount).toFixed(2)}）`;
  toast(statusText);
}

function payInstallment() {
  const idx = parseInt(document.getElementById('installPayIndex').value);
  const amtInput = document.getElementById('installPayAmount');
  const amount = parseFloat(amtInput.value);
  if (isNaN(idx) || idx < 1) { toast('请输入有效期数'); return; }
  const d = debts[_installDebtIdx];
  if (!d.installments || idx > d.installments.length) { toast('期数超出范围'); return; }
  quickPayInstall(_installDebtIdx, idx - 1, amount);
  document.getElementById('installPayIndex').value = '';
  amtInput.value = '';
}

// ============ LEDGER ============
const expenseCats = ['餐饮','交通','购物','娱乐','住房','医疗','教育','通讯','其他'];
const incomeCats = ['工资','理财','兼职','红包','其他'];
function toggleLedgerCats() {
  const type = document.getElementById('ledgerType').value;
  const sel = document.getElementById('ledgerCat');
  const cats = type === 'income' ? incomeCats : expenseCats;
  const icons = type === 'income' ? {'工资':'💰','理财':'📈','兼职':'💼','红包':'🧧','其他':'📦'} : {'餐饮':'🍔','交通':'🚗','购物':'🛒','娱乐':'🎮','住房':'🏠','医疗':'💊','教育':'📚','通讯':'📱','其他':'📦'};
  sel.innerHTML = cats.map(c => `<option value="${c}">${icons[c]||'📦'} ${c}</option>`).join('');
}

function openLedgerModal(idx) {
  document.getElementById('ledgerModalTitle').textContent = idx !== undefined ? '编辑记录' : '记一笔';
  if (idx !== undefined) {
    const l = ledger[idx];
    document.getElementById('ledgerType').value = l.type;
    toggleLedgerCats();
    document.getElementById('ledgerCat').value = l.cat;
    document.getElementById('ledgerAmount').value = l.amount;
    document.getElementById('ledgerNote').value = l.note || '';
    document.getElementById('ledgerDate').value = l.date;
    document.getElementById('ledgerModal').dataset.idx = idx;
  } else {
    toggleLedgerCats();
    document.getElementById('ledgerAmount').value = '';
    document.getElementById('ledgerNote').value = '';
    document.getElementById('ledgerDate').value = new Date().toISOString().slice(0,10);
    document.getElementById('ledgerModal').dataset.idx = '';
  }
  openModal('ledgerModal');
}

function saveLedger() {
  const type = document.getElementById('ledgerType').value;
  const cat = document.getElementById('ledgerCat').value;
  const amount = parseFloat(document.getElementById('ledgerAmount').value) || 0;
  const note = document.getElementById('ledgerNote').value.trim();
  const date = document.getElementById('ledgerDate').value || new Date().toISOString().slice(0,10);
  if (amount <= 0) { toast('请输入有效金额'); return; }
  const idx = document.getElementById('ledgerModal').dataset.idx;
  if (idx !== '') {
    ledger[idx] = { ...ledger[idx], type, cat, amount, note, date };
  } else {
    ledger.push({ type, cat, amount, note, date, createdAt: Date.now() });
  }
  saveData('ledger', ledger);
  closeModal('ledgerModal');
  renderLedger();
  renderOverview();
  autoBackup();
  toast('保存成功');
}

function deleteLedger(i) {
  showConfirm('确定删除这条记录吗？', () => {
    ledger.splice(i, 1);
    saveData('ledger', ledger);
    renderLedger();
    toast('已删除');
  });
}

function renderLedger() {
  const dateFrom = document.getElementById('ledgerDateFrom').value;
  const dateTo = document.getElementById('ledgerDateTo').value;
  const typeFilter = document.getElementById('ledgerTypeFilter').value;

  let filtered = [...ledger];
  if (dateFrom) filtered = filtered.filter(l => l.date >= dateFrom);
  if (dateTo) filtered = filtered.filter(l => l.date <= dateTo);
  if (typeFilter) filtered = filtered.filter(l => l.type === typeFilter);
  filtered.sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt||0) - (a.createdAt||0));

  const list = document.getElementById('ledgerList');
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="icon">📝</div><p>没有匹配的记录</p></div>';
  } else {
    list.innerHTML = filtered.map((l, i) => {
      const realIdx = ledger.indexOf(l);
      const icon = l.type === 'income' ? '💵' : '💸';
      return `<div class="ledger-item">
        <div class="li-icon ${l.type}">${icon}</div>
        <div class="li-info"><div class="cat">${esc(l.cat)}</div><div class="note">${esc(l.note||'')}</div></div>
        <div class="li-amount ${l.type}">${l.type === 'income' ? '+' : '-'}¥${(l.amount||0).toFixed(2)}</div>
        <div class="li-date">${l.date||''}</div>
        <button class="icon-btn" onclick="deleteLedger(${realIdx})" style="width:28px;height:28px;font-size:11px;flex-shrink:0;">✕</button>
      </div>`;
    }).join('');
  }

  renderLedgerCharts(filtered);
}

let chartPie = null, chartDaily = null;

function renderLedgerCharts(data) {
  // Pie - expense categories
  const expenses = data.filter(l => l.type === 'expense');
  const catMap = {};
  expenses.forEach(l => { catMap[l.cat] = (catMap[l.cat]||0) + (parseFloat(l.amount)||0); });
  const pieLabels = Object.keys(catMap);
  const pieData = Object.values(catMap);
  const pieColors = ['#ef4444','#f59e0b','#10b981','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1'];

  const pieCtx = document.getElementById('chartPie').getContext('2d');
  if (chartPie) chartPie.destroy();
  chartPie = new Chart(pieCtx, {
    type: 'doughnut',
    data: { labels: pieLabels.length ? pieLabels : ['暂无'], datasets: [{ data: pieData.length ? pieData : [1], backgroundColor: pieColors, borderWidth: 2 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { font: { size: 11 }, boxWidth: 12, padding: 8 } } } }
  });

  // Daily trend
  const dailyMap = {};
  data.forEach(l => {
    const d = l.date || '';
    if (!dailyMap[d]) dailyMap[d] = { income: 0, expense: 0 };
    dailyMap[d][l.type] += parseFloat(l.amount) || 0;
  });
  const days = Object.keys(dailyMap).sort();
  const incData = days.map(d => dailyMap[d].income);
  const expData = days.map(d => dailyMap[d].expense);

  const dailyCtx = document.getElementById('chartDaily').getContext('2d');
  if (chartDaily) chartDaily.destroy();
  chartDaily = new Chart(dailyCtx, {
    type: 'line',
    data: {
      labels: days,
      datasets: [
        { label: '收入', data: incData, borderColor: '#10b981', backgroundColor: '#10b98120', fill: true, tension: .4, borderWidth: 2, pointRadius: 3 },
        { label: '支出', data: expData, borderColor: '#ef4444', backgroundColor: '#ef444420', fill: true, tension: .4, borderWidth: 2, pointRadius: 3 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top', labels: { font: { size: 11 }, boxWidth: 12 } } },
      scales: { y: { beginAtZero: true, ticks: { callback: v => '¥' + v } } }
    }
  });

  // Heatmap
  renderHeatmap(data);
}

function renderHeatmap(data) {
  const container = document.getElementById('heatmapContainer');
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startDow = firstDay.getDay(); // 0=Sun
  const totalDays = lastDay.getDate();

  // Daily expense amounts
  const dailyExp = {};
  data.filter(l => l.type === 'expense').forEach(l => {
    if (l.date) {
      const d = parseInt(l.date.split('-')[2]) || 0;
      dailyExp[d] = (dailyExp[d]||0) + (parseFloat(l.amount)||0);
    }
  });

  // Find max for color scale
  const amounts = Object.values(dailyExp);
  const maxAmt = amounts.length ? Math.max(...amounts) : 1;

  const dayNames = ['日','一','二','三','四','五','六'];
  let html = '<div class="cal-heatmap">';
  dayNames.forEach(d => { html += `<div class="day-label">${d}</div>`; });

  let day = 1;
  for (let row = 0; row < 6 && day <= totalDays; row++) {
    for (let col = 0; col < 7; col++) {
      if (row === 0 && col < startDow) {
        html += `<div class="cal-cell outside"></div>`;
      } else if (day > totalDays) {
        html += `<div class="cal-cell outside"></div>`;
      } else {
        const amt = dailyExp[day] || 0;
        const level = amt === 0 ? 0 : Math.min(5, Math.ceil((amt / maxAmt) * 5));
        html += `<div class="cal-cell level-${level}" title="${month+1}月${day}日：¥${amt.toFixed(2)}">${day}</div>`;
        day++;
      }
    }
  }
  html += '</div>';
  html += `<div style="display:flex;align-items:center;gap:6px;justify-content:flex-end;font-size:11px;color:#94a3b8;">
    <span>少</span>
    <span style="width:14px;height:14px;border-radius:3px;background:#f1f5f9;display:inline-block;"></span>
    <span style="width:14px;height:14px;border-radius:3px;background:#bbf7d0;display:inline-block;"></span>
    <span style="width:14px;height:14px;border-radius:3px;background:#86efac;display:inline-block;"></span>
    <span style="width:14px;height:14px;border-radius:3px;background:#4ade80;display:inline-block;"></span>
    <span style="width:14px;height:14px;border-radius:3px;background:#22c55e;display:inline-block;"></span>
    <span style="width:14px;height:14px;border-radius:3px;background:#16a34a;display:inline-block;"></span>
    <span>多</span>
  </div>`;
  container.innerHTML = html;
}

// ============ TOOLS ============
function calcMortgage() {
  const amount = parseFloat(document.getElementById('mortgageAmount').value) || 0;
  const rate = (parseFloat(document.getElementById('mortgageRate').value) || 0) / 100 / 12;
  const months = (parseInt(document.getElementById('mortgageYears').value) || 0) * 12;
  if (!amount || !rate || !months) { document.getElementById('mortgageResult').innerHTML = '请输入完整参数'; return; }

  const payment = amount * rate * Math.pow(1 + rate, months) / (Math.pow(1 + rate, months) - 1);
  const totalPay = payment * months;
  const totalInterest = totalPay - amount;

  document.getElementById('mortgageResult').innerHTML = `
    <div class="cr-item"><span class="cr-label">月供</span><span class="cr-value" style="color:#4f46e5;font-size:18px;">¥${payment.toFixed(2)}</span></div>
    <div class="cr-item"><span class="cr-label">利息总额</span><span class="cr-value" style="color:#ef4444;">¥${totalInterest.toFixed(2)}</span></div>
    <div class="cr-item"><span class="cr-label">还款总额</span><span class="cr-value">¥${totalPay.toFixed(2)}</span></div>
  `;

  // Detail table
  let tableHtml = `<table><thead><tr><th>期数</th><th>月供</th><th>本金</th><th>利息</th><th>剩余</th></tr></thead><tbody>`;
  let balance = amount;
  for (let i = 1; i <= months && i <= 360; i++) {
    const intP = balance * rate;
    const prinP = payment - intP;
    balance -= prinP;
    if (balance < 0) balance = 0;
    if (i <= 12 || i > months - 12 || i % 12 === 0) {
      tableHtml += `<tr><td>${i}</td><td>${payment.toFixed(2)}</td><td>${prinP.toFixed(2)}</td><td>${intP.toFixed(2)}</td><td>${balance.toFixed(2)}</td></tr>`;
    }
  }
  tableHtml += '</tbody></table>';
  document.getElementById('mortgageTableWrap').style.display = 'block';
  document.getElementById('mortgageTableWrap').innerHTML = tableHtml;

  // Store for import
  window._mortgageData = { amount, rate: parseFloat(document.getElementById('mortgageRate').value) || 0, years: parseInt(document.getElementById('mortgageYears').value) || 0, payment, totalInterest };
}

function importMortgageToDebt() {
  if (!window._mortgageData) { toast('请先计算房贷'); return; }
  const d = window._mortgageData;
  const perInstall = d.amount / (d.years * 12);
  debts.push({
    name: `房贷 (${d.years}年 ${d.rate}%)`,
    amount: d.amount,
    paid: 0,
    overdue: 0,
    status: 'normal',
    installCount: d.years * 12,
    installDay: 1,
    reminder: false,
    installments: Array.from({length: d.years * 12}, (_, k) => ({ index: k + 1, status: 'pending', paid: false, paidAmount: 0, dueAmount: perInstall })),
    created: Date.now()
  });
  saveData('debts', debts);
  renderDebts();
  renderOverview();
  autoBackup();
  toast('已导入为分期债务');
}

function calcCompound() {
  const p = parseFloat(document.getElementById('compoundPrincipal').value) || 0;
  const r = (parseFloat(document.getElementById('compoundRate').value) || 0) / 100;
  const n = parseInt(document.getElementById('compoundYears').value) || 0;
  if (!p || !r || !n) { document.getElementById('compoundResult').innerHTML = '请输入完整参数'; return; }

  const total = p * Math.pow(1 + r, n);
  const interest = total - p;

  document.getElementById('compoundResult').innerHTML = `
    <div class="cr-item"><span class="cr-label">本金</span><span class="cr-value">¥${p.toFixed(2)}</span></div>
    <div class="cr-item"><span class="cr-label">收益</span><span class="cr-value" style="color:#059669;">¥${interest.toFixed(2)}</span></div>
    <div class="cr-item"><span class="cr-label">本息合计</span><span class="cr-value" style="color:#4f46e5;font-size:18px;">¥${total.toFixed(2)}</span></div>
  `;
}

// ============ EXPORT CSV ============
function exportCSV() {
  let csv = '\uFEFF';
  csv += '类型,分类,金额,备注,日期\n';
  ledger.forEach(l => {
    const type = l.type === 'income' ? '收入' : '支出';
    csv += `${type},${l.cat},${l.amount},${(l.note||'').replace(/,/g,'，')},${l.date}\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `管钱钱_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('导出成功');
}

// ============ CLEAR ALL ============
function confirmClearAll() {
  showConfirm('确定清空所有数据吗？此操作不可恢复！', () => {
    assets = []; debts = []; ledger = [];
    saveData('assets', assets);
    saveData('debts', debts);
    saveData('ledger', ledger);
    renderAssets(); renderDebts(); renderLedger(); renderOverview();
    toast('已清空所有数据');
  });
}

// ============ AUTO BACKUP ============
function autoBackup() {
  try {
    const key = `fin_backup_${new Date().toISOString().slice(0,10)}`;
    const data = { assets, debts, ledger, time: Date.now() };
    localStorage.setItem(key, JSON.stringify(data));
    // Keep only last 7 days backups
    const prefix = 'fin_backup_';
    const keys = Object.keys(localStorage).filter(k => k.startsWith(prefix)).sort();
    while (keys.length > 7) {
      const old = keys.shift();
      localStorage.removeItem(old);
    }
  } catch(e) {}
}

// Auto backup every 5 minutes
setInterval(autoBackup, 300000);

// ============ UTILITY ============
function esc(s) { if (typeof s !== 'string') return s || ''; return s.replace(/[&<>"']/g, function(m) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }

// ============ INIT ============
document.addEventListener('DOMContentLoaded', () => {
  renderOverview();
  renderAssets();
  renderDebts();
  renderLedger();
  // Request notification permission
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
  // Check for reminders on debts
  debts.forEach((d, i) => {
    if (d.reminder && d.installCount > 1 && d.installDay) {
      const today = new Date().getDate();
      if (today === d.installDay) {
        setTimeout(() => {
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification('管钱钱 - 还款提醒', { body: `今天(${d.installDay}号)是「${d.name}」的还款日，请记得还款`, icon: '💰' });
          }
        }, 3000);
      }
    }
  });
});
